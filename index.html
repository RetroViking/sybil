  const act = useRef(null);
  act.current = fn;
  useEffect(() => {
    if (!on) return;
    const away = e => { if (el.current && !el.current.contains(e.target) && !e.target.closest(OVER)) act.current(e); };
    document.addEventListener('click', away, true);
    return () => document.removeEventListener('click', away, true);
  }, [on]);
}

/* Enter is done (Shift + Enter starts a line in a box taking several), Ctrl or ⌘ + Enter goes on to the Done of what's
   open. Esc lets go of the box before anything around it. */
const typing = ({ done, esc }) => e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape' && esc) { e.preventDefault(); e.stopPropagation(); esc(e); }
  else if (e.key === 'Enter' && done && (mod || !e.shiftKey || e.target.matches('input, [enterkeyhint=done]'))) { if (!mod) e.preventDefault(); done(e); }
};

/* A button pressed with a mouse or finger hands the keyboard to the window or open thing it's in, else to nothing:
   Firefox and phones leave it on the button, so the next key pressed it again or lit a focus ring on it, and a window
   closing gave it back with a ring. Words that open for editing keep it, as a box does, for Enter; their pencil shows
   instead of a ring. A press by the keyboard (detail 0) leaves it, for Tab. */

/* Keyboard or pointer, by the last one used: .keyed on the root while it's the keyboard (rings, a dropdown keeping it).

document.body.append(tipEl);

/* Drag to rearrange, by mouse or finger, within the item's list ([data-zone]), among its [data-key]s: not those of a
   list inside it (an open task's steps, a zone of its own), nor what it carries (a task's steps). A finger rests a
   moment first so a swipe still scrolls. onDrop(key, into, lane): held well inside (past the edges of) a row that
   takes things in ([data-into]: a Tickler), into it; held over a day ([data-into] its date: the Calendar's strip), last
   on that day; else in front of the row it landed before (null: last), among those of its own [data-lane] and

/* ==== Shared components ==== */
const AddButton = ({ label, onClick }) => html`<button class="add-btn" aria-label=${label} data-tip=${label} onClick=${onClick}><${Icon} name="plus" /></button>`;
/* due: see dueOf. */
const DoneButton = ({ onClick, label, due }) => html`<button class=${cx('done-btn', due)} aria-label=${label} onClick=${onClick}><${Icon} name="check" size=${15} /></button>`;
/* How late a task is, by its day (a next action's: its deadline): on it (today) or past it (overdue), every task alike,
   so the eye tells what must be done today from what can wait (the user's ask, 2026-11-21: next actions' alone had
   it, a missed Calendar task's day red, its circle grey). */
const dueOf = r => r.date && (r.date < todayISO() ? 'overdue' : r.date === todayISO() && 'today');
/* Deletes go through removeWithUndo, so it asks nothing. A line's trash, a Someday task's (its row is an Inbox
   item's), an open question's, an answered question's (unfolded); a task or project open in place has its Delete
   (DeleteButton). None on another thing's list row, so a slip there can't delete one unnoticed. */
const Trash = ({ label, tip = 'Delete', cls, onClick }) => html`<button class=${cx('icon-btn danger', cls)} aria-label=${label} data-tip=${tip} onClick=${onClick}><${Icon} name="trash" size=${15} /></button>`;
/* On a press, keeps the cursor in the field being typed in. */
const holdFocus = e => e.preventDefault();

/* A box that grows with its words, measured again as its width changes too: measured while the page was still narrow
   (Capture as the installed app starts cold), an empty box kept its placeholder's wrapped height, and the window was
   twice its size or more. line: one line of words that wraps, where Enter is Done (a phone's key says so) and a pasted
   break becomes a space. Measuring resets it to its rows for a moment, which would pull up a page scrolled to its end:
   the scroll is kept. */

    const el = ref.current, box = scrollerOf(el), top = box && box.scrollTop;
    el.style.height = '';
    if (el.scrollHeight > el.clientHeight) el.style.height = el.scrollHeight + el.offsetHeight - el.clientHeight + 'px';
    if (box) box.scrollTop = top;
  };
  useLayoutEffect(fit, [value, rest.placeholder]);

    const el = ref.current;
    let width = el.clientWidth;
    const watch = new ResizeObserver(() => { if (el.clientWidth !== width) { width = el.clientWidth; fit(); } });
    watch.observe(el);

/* A one-line name box (words edited in place): Enter or a press elsewhere keeps a changed name with words in it, Esc

   pointer; closed stays closed, so a blur on removal can't keep it twice. */

  useEffect(() => focusAt(ref.current), []);

    if (closed.current) return;
    closed.current = true;
    onClose(e);

/* A Tickler open in place everywhere (one there is, a new one, what the Sweep makes one; see TaskEditor): its repeat's

/* A task's fields as an editor shows them, all its changes in one object (it: the task there is, or as it starts). A

      ${old && html`<${DeleteButton} old=${old} drop=${drop} />`}
      <${Status} error=${error} />
      ${kind !== 'someday' && html`<div class="when"><${When} f=${f} set=${set} it=${it} /></div>`}
    </div>
    ${kind === 'tickler' && html`<${StepList} list=${f.steps} onChange=${fn => setF(f => ({ ...f, steps: fn(f.steps) }))} />`}
  </div></li>`;
}

/* A step's tick goes where its words went (moved, steps added or taken out around it); one renamed is a new step. */
function ticksAfter(old, steps) {
  const done = old.ticked.map(i => old.steps[i]);
  return steps.flatMap((s, i) => { const k = done.indexOf(s); if (k < 0) return []; done.splice(k, 1); return [i]; });
}
/* Where a task saved went, when it's made or changes day or page: a next action to its context on Next, what repeats
   to Ticklers, what has no day to Someday, the rest to the Calendar (or Next, today). */
const setFor = r => r.context ? `Added to ${store.items[r.context].title}` : r.date ? `${isRepeating(r) ? 'Tickler' : 'Task'} set for ${fmtDay(r.date)}` : 'Added to Someday';
/* A thing's editor, by its kind. */
const editorOf = kind => kind === 'reminder' ? TaskEditor : PickEditor;
/* Whether a new thing of the kind is open (ui.open, as it starts; not one in the place of one there is: see Picks). */
const newOpen = kind => ui.open?.kind === kind && !ui.open.id;
/* A new thing open in place in a pane of its own: above its list, or in the place of the Sweep's item (bar: see
   useOpened). */
const NewThing = ({ bar }) => { const o = ui.open, Editor = editorOf(o.kind); return html`<${Block}><ul class="list"><${Editor} key=${o.key} initial=${o} bar=${bar} /></ul><//>`; };

/* A list of tasks: each task's row, its project, and a Tickler's unticked steps under it, folded by their count
   (they're routine) until unfolded, kept so while you're on the page, more added at their foot; open, its editor (its
   project's, ticked: see completeReminder). day(r): the words for its day, nothing where its page or pane names it
   (Next's today, the Calendar's days). A click anywhere on it opens it, a project's next action its project, in the
   row's place (one editor for the two: the user's ask; the Sweep's task, the Sweep: see OWN; the Review, nothing: only
   its circle); deleting is its open row's, never a slip on the row. A task of the data's and its steps drag (see
   dropTask), among the rows of their lane (laneOf), into a Tickler too; the page puts the list in its zone. */
function useTaskRows(day) {
  const [flipped, setFlipped] = useKept('flipped', []);
  const tap = useTapped();
  const row = r => {
    if (ui.open?.id === r.id) return html`<${TaskEditor} key=${r.id} old=${r} />`;
    if (r.project && ui.open?.id === r.project) return html`<${PickEditor} key=${r.project} old=${store.items[r.project]} next=${ui.open.next} />`;
    const steps = r.steps.map((title, i) => ({ title, i })).filter(({ i }) => !r.ticked.includes(i));
    const unfolded = flipped.includes(r.id);
    const when = [day(r), r.time && fmtTime(r.time)].filter(Boolean).join(' · ');
    const fold = steps.length > 0 && html`<button class="li-link" aria-expanded=${unfolded} onClick=${() => setFlipped(toggleIn(flipped, r.id))}>${units(steps.length, 'step')}<span class="chev"><${Icon} name="right" size=${13} /></span></button>`;
    const own = OWN[r.id], go = own ? own.go : () => openThing({ id: r.project || r.id }), p = store.items[r.project], lane = r.context || r.date, due = dueOf(r);
    const drag = key => ({ 'data-key': key, 'data-lane': lane, 'data-time': r.time, onPointerDown: e => startDrag(e, (...aim) => dropTask(key, ...aim)), onTouchMove: holdTouch });
    return html`<li key=${r.id}><div class=${cx('li rem-row', go && 'tappable', !own && 'drags')} onClick=${go && opens(go)} ...${!own && { ...drag(r.id), 'data-into': isRepeating(r) ? '' : undefined }}>
      ${go ? html`<button class="li-title" onClick=${go}>${r.title}</button>` : html`<span class="li-title">${r.title}</span>`}
      <div class="rem-side">
        ${isRepeating(r) && html`<span class="rem-rule"><${Icon} name="repeat" size=${12} />${isLast(r) ? html`<b class="last">Last one</b>` : repeatShort(r.repeat)}</span>`}<br />
        <span class=${cx('rem-when', due)}>${when}</span>
      </div>
      ${p && html`<span class="rem-proj"><${Icon} name="project" size=${12} />${p.title}</span>`}
      ${(fold || !p) && html`<div class="rem-fold">${fold}</div>`}
      <${DoneButton} label=${'Done: ' + r.title} due=${due} onClick=${() => completeReminder(r)} />
    </div>${steps.length > 0 && unfolded && html`<ul class="li-steps">${steps.map(({ title, i }) => { const o = tap(r.id + '.' + i); return html`<li class=${cx('li hov drags', o.open && 'open')} onClick=${o.onClick} key=${i} ...${drag(r.id + '/' + i)}>
      <div class="li-body"><${EditableText} value=${title} onSave=${v => patchItem(r.id, { steps: r.steps.map((s, j) => j === i ? v : s) })} /></div>
      <${DoneButton} label=${'Done: ' + title} onClick=${() => howtoDone(r, i)} />
    </li>`; })}<${AddLine} hint="Add step" onAdd=${lines => patchItem(r.id, { steps: [...r.steps, ...lines] })} data-key=${r.id + '/' + r.steps.length} data-lane=${lane} data-time=${r.time} /></ul>`}</li>`;
  };
  return list => html`<ul class="list sections">${list.map(row)}</ul>`;
}

/* ==== Navigation ==== */
/* The rail, in order; the number keys follow it: what's next, what comes in, then where the Sweep files it. Seven at
   most: more crowd a phone's bar. The Sweep isn't on it: the Inbox's broom
   (Shift + S) enters it. Ids keep the pages' first names: today (Next), reminders (the Calendar). */
const NAV = [
  { id: 'today', label: 'Next' },
  { id: 'inbox', label: 'Inbox' },
  { id: 'reminders', label: 'Calendar' },
  { id: 'ticklers', label: 'Ticklers' },
  { id: 'projects', label: 'Projects' },
  { id: 'someday', label: 'Someday' },
  { id: 'research', label: 'Research' },
];
/* SIByL opens on Next, or where the Sweep had got to if it was left mid-Sweep (a tab closed by a slip; saved on
   visibilitychange in browser storage, sybil.work). kept: how the page is showing (see useKept). */
let route = { view: 'today', kept: {} };
const kept = JSON.parse(localStorage.getItem('sybil.work'));
if (kept) route = { view: 'work', kept };
/* Where you've been, restoring scroll and kept as a browser does, never into the Sweep. Going to another page drops
   what's open in place (a click on the rail saved it first). */
const trail = [];
let scrollTo = 0;
function navigate(view, back) {
  if (!back && view !== route.view && route.view !== 'work') {
    trail.push({ ...route, scroll: main().scrollTop });
    if (trail.length > 50) trail.shift();
  }
  scrollTo = back ? back.scroll : 0;
  route = { view, kept: back ? back.kept : view === route.view ? route.kept : {} };
  ui.open = null;
  refresh();
}
/* Back (Backspace, a browser's or phone's Back): the Back on screen (the Sweep's), else the page you came from. */
function goBack() {
  const b = document.querySelector('[data-kbd=back]');
  if (b) return b.click();
  const r = trail.pop();
  if (r) navigate(r.view, r);
}
/* A browser's or phone's Back goes back in SIByL, after closing what's open on top (a thing open in place keeps its
   changes: see useLayer), and leaves it only from where there's nothing to go back to, as from any page. SIByL holds
   one entry of the browser's history for it, from the first press (a browser skips one added before). */
let held = false;
const hold = () => { if (!held) { held = true; history.pushState(null, ''); } };
addEventListener('click', hold, true);
addEventListener('keydown', hold, true);
addEventListener('popstate', () => {
  held = false;
  if (layers.length) { const top = layers.at(-1).current; (top.back || top.close)(); }
  else if (document.querySelector('[data-kbd=back]') || trail.length) goBack();
  else return history.back();
  hold();
});
/* window: the one window over the page ({ Body, ...its props }: Capture). open: what's open in place, its row turned
   into its editor: { id } of a thing there is (next: a project whose next action was ticked), or a new one as it
   starts ({ kind, ... }: at the top of its list, or in the place of the Sweep's item; with an id, in that thing's
   place: a Someday task made a project). splash: a word a moment over the page (see Splash). */
const ui = { window: null, open: null, splash: null };
function setUI(patch) { Object.assign(ui, patch); refresh(); }
/* The thing open in place, if any (see useOpened): its save and drop. */
let opened = null;
/* One at a time: the one open is saved first, and stays open if it can't be. key: each new one is drawn afresh, even
   where the one just saved stood. */
function openThing(o) { if (!opened || opened.save()) setUI({ open: { ...o, key: uid() } }); }

/* The Sweep (Shift + S, the Inbox's Sweep, the Sweep's own task), its broom a moment over it as it begins; with
   nothing in the Inbox, nothing to sweep: a moment's word that it's empty, over the page you're on. */
function sweep() {
  const some = all('inbox').length > 0;
  if (some) navigate('work');
  setUI({ splash: some ? { art: 'work', words: 'Sweep' } : { art: 'inbox', words: 'Inbox is empty' } });
}
/* A section's icon and a word in its colour, over the page a moment, then gone (a click sends it at once). */
function Splash({ art, words }) {
  useEffect(() => { const t = setTimeout(() => setUI({ splash: null }), 800); return () => clearTimeout(t); }, []);
  return html`<div class="splash" style=${{ '--t': `var(--c-${art})` }} onClick=${() => setUI({ splash: null })}><div><${Art} id=${art} size=${84} /><b>${words}</b></div></div>`;
}

/* How this device's copy stands with Dropbox, in words (the user's ask, 2026-11-20: a dot on Settings' gear left them
   unsure), and only words (2026-11-21: a cloud and a hover light made them look pressable): Synced, or Syncing while
   it has changes Dropbox hasn't; in red, what keeps them from it: Offline, Not synced (a sync failed: it tries again,
   see failed), Signed out (by Dropbox: see signOut; Settings connects it again). Nothing while SIByL isn't connected
   (Disconnect). */
function SyncState() {
  if (auth === null) return null;
  const [word, bad] = auth === false ? ['Signed out', 1] : !navigator.onLine ? ['Offline', 1] : stuck ? ['Not synced', 1] : [store.unpushed ? 'Syncing' : 'Synced'];
  return html`<span class=${cx('sync', bad && 'bad')}>${word}</span>`;
}
/* How it syncs, then History and Settings, pages off the rail (no number key): at the rail's foot or in a phone's top
   bar. */
const Tools = () => html`<${SyncState} /><button class="icon-btn" aria-label="History" onClick=${() => navigate('history')}><${Icon} name="history" /></button>
  <button class="icon-btn" aria-label="Settings" onClick=${() => navigate('settings')}><${Icon} name="gear" /></button>`;
function Sidebar() {
  const inboxN = all('inbox').length;
  const waits = { inbox: inboxN > 0 && `Inbox, ${inboxN} waiting`, research: all('study').some(s => s.answered && !s.read) && 'Research, a new answer' };
  return html`<aside class="sidebar" aria-label="Sections">
    <nav class="nav">
      ${NAV.map(n => { const on = route.view === n.id, flag = waits[n.id]; return html`
        <button key=${n.id} class=${cx('nav-item', on && 'on')} style=${{ '--t': `var(--c-${n.id})` }} aria-label=${flag || n.label}
          aria-current=${on ? 'page' : null} onClick=${() => navigate(n.id)}>
          <span class="nav-ico"><${Art} id=${n.id} size=${30} />${flag && html`<span class="nav-flag" aria-hidden="true"></span>`}</span>
          <span class="nav-label">${n.label}</span>
        </button>`; })}
    </nav>
    <div class="side-foot"><${Tools} /></div>
  </aside>`;
}

/* ==== Next ('today' inside, its first name) ==== */
/* What's next, a pane by where it comes from: the Ticklers and the Calendar, what SIByL brought up (due, then coming
   up; Someday's, with no day, never), then a pane per context (in Settings' order), its next actions, there from the
   moment they're made until done, in the order dragged (a deadline only shows). Things leave only by being done (no x,
   trash or putting off): one missed, repeating or not, waits here, its day in red, until ticked; a repeat then goes on
   from today (following). A next action dragged into another context's pane takes that context (the page is their
   zone; the Ticklers and the Calendar are each their own). */
function TodayView() {
  const t = todayISO();
  /* The app's own tasks (see OWN), sorted as tasks due on their day (first of that day's), until ticked: Ticklers'. */
  const own = Object.entries(OWN).map(([id, o]) => ({ id, title: o.title, date: o.due(t), repeat: o.repeat(), steps: [], ticked: [], order: -1 }))
    .filter(r => r.date && store.items[r.id]?.done !== r.date);
  const shown = [...own, ...all('reminder').filter(r => r.date && !r.context && !onHold(r))].sort(byDue)
    .filter(r => r.date <= t || (r.ahead > 0 && dayDiff(t, r.date) <= r.ahead));
  const contexts = inOrder('context').map(c => ({ c, list: all('reminder').filter(r => r.context === c.id && !onHold(r)).sort(byOrder) })).filter(x => x.list.length);
  const tasks = useTaskRows(r => r.date && (r.context || r.date !== t) && fmtDay(r.date));
  const adding = newOpen('reminder');
  const pane = (title, icon, list) => { const due = list.filter(r => r.date <= t), soon = list.filter(r => r.date > t); return list.length > 0 && html`<${Block} key=${title} title=${title} icon=${icon} data-zone>
    ${due.length > 0 && html`<div class="group">${tasks(due)}</div>`}
    ${soon.length > 0 && html`<div class="group"><div class="sub-h">Coming up</div>${tasks(soon)}</div>`}
  <//>`; };
  return html`<div class="page" data-zone>
    <${PageHeader} nav="today"><${AddButton} label="New next action" onClick=${() => openThing({ kind: 'reminder', date: '', next: true })} /><//>
    ${adding && html`<${NewThing} />`}
    ${pane('Ticklers', 'ticklers', shown.filter(isRepeating))}
    ${pane('Calendar', 'reminders', shown.filter(r => !isRepeating(r)))}
    ${contexts.map(({ c, list }) => html`<${Block} key=${c.id} title=${c.title} data-lane=${c.id}>${tasks(list)}<//>`)}
    ${!shown.length && !contexts.length && !adding && html`<p class="empty">Nothing next.</p>`}
  </div>`;
}

/* ==== Plain lists ==== */
/* A plain list's line (the Inbox's, a how-to being written, a project's support, a context): its words renamed in
   place; its tools brought out over it by a mouse, or by a finger tapping it open (see useTapped): its trash, unless
   it can't go (a context holding tasks); onUp's ↑ first (a support line made the next action: see PickEditor); with
   onMove, dragged to another place in its list ([data-zone]) as a project is, at its place there (at). */
const ListLine = ({ open, onClick, text, onSave, verb = 'Delete', onDelete, onUp, at, onMove }) => html`<li class=${cx('step-row hov', open && 'open', onMove && 'drags')}
  onClick=${onClick} data-key=${at} onPointerDown=${onMove && (e => startDrag(e, onMove))} onTouchMove=${onMove && holdTouch}>
  <div class="li-body"><${EditableText} cls="step-title" value=${text} onSave=${onSave} /></div>
  ${onUp && html`<button class="icon-btn reveal" aria-label=${'Make it next: ' + text} data-tip="Make it next" onClick=${onUp}><${Icon} name="up" size=${15} /></button>`}
  ${onDelete && html`<${Trash} cls="reveal" label=${verb + ' ' + text} tip=${verb} onClick=${onDelete} />`}
</li>`;
/* tap(key) gives a row its open and onClick. A press on another row is left to its tap; one on a button (its own
   trash or circle too: a row that went with it left Back a layer with nothing to close) or anywhere else on the page
   (not on what floats over it: see OVER) closes it as the press lands, or as it ends when it was a scroll; so do
   Esc and a drag (a step dragged out of its task left Back a layer with nothing to close). */
function useTapped() {
  const [tapped, setTapped] = useState(null);
  useLayer(tapped, () => setTapped(null));
  useEffect(() => {
    if (!tapped) return;
    let live = true;
    const close = () => { if (live) setTapped(null); };
    const away = e => { const t = e.target; if ((!t.closest('.hov') || t.closest('button')) && !t.closest(OVER)) onPressEnd(close); };
    document.addEventListener('pointerdown', away);
    addEventListener('lift', close);
    return () => { live = false; document.removeEventListener('pointerdown', away); removeEventListener('lift', close); };
  }, [tapped]);
  return k => ({ open: tapped === k, onClick: opens(() => { if (touching()) setTapped(t => t === k ? null : k); }) });
}
/* The foot of a task's steps, open in place or only unfolded: Enter or a press elsewhere adds what's typed, a line each
   (onAdd gets them), and stays (Enter with nothing typed is what's open's Done); Esc drops it (notSaved). li: its
   line's attributes (where a drag lands: see useTaskRows). */
function AddLine({ hint, onAdd, ...li }) {
  const [draft, setDraft] = useState('');
  const box = useRef(null), dropped = useRef(false);
  const add = text => { onAdd(splitLines(text)); setDraft(''); };
  return html`<li ...${li}><div class="add-row" onClick=${() => box.current.focus()}>
    <${AutoTextarea} inputRef=${box} value=${draft} placeholder=${hint} aria-label=${hint} onInput=${e => setDraft(e.target.value)}
      onKeyDown=${typing({ done: draft.trim() && (() => add(draft)), esc: e => { dropped.current = true; setDraft(''); e.target.blur(); if (draft.trim()) notSaved(() => add(draft)); } })}
      onBlur=${() => { const text = draft; if (dropped.current) dropped.current = false; else if (text.trim()) onPressEnd(() => add(text)); }} />
    <span class="add-ico"><${Icon} name="plus" size=${16} /></span>
  </div></li>`;
}
/* An open thing's steps (a Tickler's, as they show unfolded; a project's support: unit info, hint its foot's words),
   folded under a line counting them, which unfolds them (what's changed most often is when, and an open thing stays
   short): renamed, removed and dragged in place, more added at the foot; onUp(i) gives a line its ↑. None's foot
   shows, staying as the first is added. onChange takes a function of the list, so pasted lines all count. */
function StepList({ list, onChange, onUp, unit = 'step', hint = 'Add step' }) {
  const tap = useTapped();
  const [open, setOpen] = useState(!list.length);
  return html`<ul class="li-steps" data-zone>
    ${list.length > 0 && html`<li key="fold" class="fold"><button class="line-btn" aria-expanded=${open} onClick=${() => setOpen(!open)}><span class="chev"><${Icon} name="right" size=${16} /></span>${units(list.length, unit)}</button></li>`}
    ${open && list.map((t, n) => html`<${ListLine} key=${n} ...${tap('step' + n)} text=${t} onSave=${v => onChange(l => l.map((x, i) => i === n ? v : x))}
      verb="Remove" onDelete=${() => onChange(l => l.filter((_, i) => i !== n))} onUp=${onUp && (() => onUp(n))} at=${n} onMove=${before => onChange(l => moveBefore(l, n, before == null ? null : +before))} />`)}
    ${open && html`<${AddLine} key="add" hint=${hint} onAdd=${lines => onChange(l => [...l, ...lines])} />`}
  </ul>`;
}

/* ==== Inbox ==== */
/* What's captured, a line an item; from elsewhere (see gather), at the capture's time, so captures keep their order,
   and with its name (stem) for its lines' ids, <stem>-<line>, so one that comes twice is made once. */
function addToInbox(text, at = Date.now(), stem) {
  const lines = splitLines(text);
  lines.forEach((text, i) => { const id = stem && `${stem}-${i}`; if (!stem || !(id in store.items || id in store.gone)) newItem('inbox', { text, created: at + i }, id); });
  return lines.length;
}
/* The Inbox only collects; going through it is the Sweep's. Here a thing can only be renamed or deleted. */
function InboxView() {
  const [draft, setDraft] = useState('');
  const tickler = setting('tickler').trim();
  const items = all('inbox').sort(byCreated);
  const tap = useTapped();
  const add = () => { if (addToInbox(draft)) setDraft(''); };
  return html`<div class="page">
    <${PageHeader} nav="inbox"><button class="btn" onClick=${sweep}><${Art} id="work" size=${18} />Sweep</button><//>
    ${tickler && html`<p class="note tickler">${linked(tickler)}</p>`}
    <div class="capture-box">
      <${AutoTextarea} value=${draft} rows="2" placeholder="Type or paste. Each line becomes its own item." aria-label="New inbox items"
        onInput=${e => setDraft(e.target.value)} onKeyDown=${typing({ done: add })} />
      <button class=${cx('send-btn', draft.trim() && 'ready')} aria-label="Add to Inbox" onMouseDown=${holdFocus} onClick=${add}><${Icon} name="up" size=${16} /></button>
    </div>
    ${items.length ? html`<div class="panel"><ul class="list">${items.map(it => html`<${ListLine} key=${it.id} ...${tap(it.id)}
      text=${it.text} onSave=${text => patchItem(it.id, { text })} onDelete=${() => deleteThing(it)} />`)}
    </ul></div>` : html`<div class="inbox-zero" role="img" aria-label="Inbox zero"><svg viewBox="2 3 24 21.86" aria-hidden="true"><path fill-rule="evenodd" d=${TRAY_THIN} /></svg></div>`}
  </div>`;
}

/* ==== Projects and questions ==== */
/* What's wrong with an open thing, under its name. */
const Status = ({ error }) => error && html`<p class="err" role="alert">${error}</p>`;
/* An open task's or project's Delete, right under its name. */
const DeleteButton = ({ old, drop }) => html`<button class="line-btn del-btn" aria-label=${'Delete ' + old.title} onClick=${() => { drop(); deleteThing(old); }}><${Icon} name="trash" size=${16} />Delete</button>`;
/* A project or question open in place, as a task opens: one there is (old), or a new one (initial; its file says how
   it's made, else addThing; a Someday task made one opens in that task's place, see TaskEditor). A project opens as a
   task does: its name and, where a task's circle is, its hold (on hold it goes to Someday, its next action kept but
   off Next and the Calendar; resumed, back); its Delete (its next action goes too); its next action, written a task's
   way (taskFields, When; checked as one: taskOf): its words led by an arrow, as when-rows by their marks, typed in
   where they stand, then its context, or, with none, the day it comes up, as it can't be done before (submissions open
   on 1 Feb): it waits on the Calendar, not on Next; then its support (no description: what it's for is its name), a
   line of which ↑ swaps with the next action's words, so only one is ever next and nothing typed is lost. next: its
   next action was ticked (see completeReminder), so the next one is written, or moved up from its support, in the last
   one's context; saved, the old one is ticked; Project done, in Delete's place, ticks it and ends the project; both
   with Undo; Esc, or nothing written, ticks nothing. A question opens as an answered one unfolds: its name, its
   description, its trash at its row's end. Saving needs a name. bar: see useOpened. */
function PickEditor({ old, initial, next, bar }) {
  const it = old || initial, { label } = PICKS[it.kind], project = it.kind === 'project', was = old && project && actionOf(old);
  /* Its next action as it is, or as it starts (a new project's maybe the Sweep's item: see ANSWERS). */
  const at = (!next && was) || { project: old?.id || 'new', date: '' };
  const [title, setTitle] = useState(it.title || '');
  const [note, setNote] = useState(it.note || '');
  const [steps, setSteps] = useState(it.steps || []);
  const [act, setAct] = useState(() => taskFields(next ? { context: was.context, date: '' } : was || { date: '', title: it.action }));
  const setA = k => v => setAct(f => ({ ...f, [k]: v }));
  const up = i => { const words = oneLine(act.title); setSteps(l => words ? l.toSpliced(i, 1, words) : l.toSpliced(i, 1)); setA('title')(steps[i]); };
  const tick = () => { removeItem(was.id); return logDone(was); };
  const { box, error, save, drop } = useOpened({ old, bar, draft: JSON.stringify([title, note, steps, act]), save: fail => {
    if (!oneLine(title)) return fail('Give it a name.');
    const n = project && (oneLine(act.title) ? taskOf(act, at) : 'Give it a next action.');
    if (typeof n === 'string') return fail(n);
    const h = { title: oneLine(title), ...(project ? { steps } : { note: note.trim() }) };
    if (next) {
      const unlog = tick(), made = makeThing('reminder', n);
      patchItem(old.id, h);
      doneToast(`Done: ${clip(was.title)}`, () => { removeItem(made.id); put(was); put(old); unlog(); });
    } else if (old) {
      patchItem(old.id, h);
      if (was && JSON.stringify(act) !== JSON.stringify(taskFields(was))) patchItem(was.id, { ...n, ticked: ticksAfter(was, n.steps) });
    } else {
      const made = it.file ? it.file(h) : addThing(it.kind, h);
      if (project) makeThing('reminder', { ...n, project: made.id });
    }
    return true;
  } });
  /* Saved first. */
  const hold = () => {
    if (!save()) return;
    const p = store.items[old.id];
    patchItem(p.id, { hold: !p.hold });
    toast(p.hold ? 'Moved to Projects' : 'Moved to Someday', { undo: () => put(p) });
  };
  const finish = () => {
    drop();
    const unlog = tick();
    removeItem(old.id);
    doneToast(`Done: ${clip(old.title)}`, () => { put(was); put(old); unlog(); });
  };
  const holds = old?.hold ? 'Resume' : 'Put on hold';
  return html`<li class="editing" ref=${box} tabindex="-1"><div class="pick-row">
    <div class="li-body edit-b">
      ${project ? html`<div class="name-line"><div class="li-body"><${Name} label=${label} value=${title} onInput=${setTitle} /></div>
          ${old && !next && html`<button class="ring-btn" aria-pressed=${!!old.hold} aria-label=${holds} data-tip=${holds} onClick=${hold}><${Icon} name="pause" size=${18} /></button>`}</div>
        ${next ? html`<button class="line-btn" onClick=${finish}><${Icon} name="check" size=${16} />Project done</button>` : old && html`<${DeleteButton} old=${old} drop=${drop} />`}
        <${Status} error=${error} />
        <div class="row act">${mark('act-title', 'next')}<${AutoTextarea} line id="act-title" class="words" autofocus=${!!it.title && !oneLine(act.title) && !touching()} aria-label="Next action"
          placeholder="Next action" value=${act.title} onInput=${e => setA('title')(e.target.value)} /></div>
        <div class="when"><${When} f=${act} set=${setA} it=${at} /></div>
        <${StepList} list=${steps} onChange=${setSteps} onUp=${up} unit="info" hint="Add info" />`
      : html`<${Name} label=${label} value=${title} onInput=${setTitle} />
        <${Status} error=${error} />
        <${Words} class="note" aria-label="Description" placeholder="Add description" value=${note} onInput=${e => setNote(e.target.value)} />`}
    </div>
    ${old && !project && html`<${Trash} cls="pick-del" label=${'Delete ' + old.title} onClick=${() => { drop(); deleteThing(old); }} />`}
  </div></li>`;
}

/* Things in a pane (title, icon: its heading, if any): projects, questions waiting, Someday's tasks. A click opens one
   in place (a Someday task made a project, the new project in its place: ui.open with its id and that kind), a drag
   moves it among the list; under each name, its line (see PICKS' sub; a question's, its description). trash: a trash
   at a row's end, brought out as an Inbox item's (Someday is an Inbox of what might be done one day). A new one opens
   in a pane of its own over the list (the page's +). empty: said when there are none (true: "No projects yet.", or its
   words). */
function Picks({ kind, list, title, icon, trash, empty = true }) {
  const adding = newOpen(kind), sub = PICKS[kind]?.sub || (h => h.note), o = ui.open;
  if (!list.length && !adding) return empty && html`<p class="empty">${empty === true ? `No ${MANY[kind]} yet.` : empty}</p>`;
  return [adding && html`<${NewThing} key="new" />`, list.length > 0 && html`<${Block} key="list" title=${title} icon=${icon}>
    <ul class="list sections" data-zone>${list.map(h => {
      if (o?.id === h.id) return o.kind ? html`<${editorOf(o.kind)} key=${o.key} initial=${o} />` : html`<${editorOf(kind)} key=${h.id} old=${h} />`;
      const go = () => openThing({ id: h.id }), line = sub(h);
      return html`<li key=${h.id}>
      <div class=${cx('pick-row tappable drags', trash && 'hov')} data-key=${h.id} onClick=${opens(go)} onTouchMove=${holdTouch}
        onPointerDown=${e => startDrag(e, before => placeInList(list, store.items[h.id], before))}>
        <div class="li-body"><button class="li-title" onClick=${go}>${h.title}</button>${line && html`<div class="note">${linked(line)}</div>`}</div>
        ${trash && html`<${Trash} cls="pick-del reveal" label=${'Delete ' + h.title} onClick=${() => deleteThing(h)} />`}
      </div>
    </li>`; })}</ul>
  <//>`];
}

/* ==== Research ('study' inside) ==== */
/* Answered (every question answered, newest first) or Waiting (the questions to research, in their order), one at a
   time once there are both: a segmented control picks (part: the one showing, null while there's only one), Answered
   unless Waiting was picked while on the page, as a new question does. Answers stay until deleted: the page is a
   manual. */
function ResearchView() {
  const studies = inOrder('study'), waiting = studies.filter(s => !s.answered);
  const answered = studies.filter(s => s.answered).sort((a, b) => b.answered.localeCompare(a.answered));
  const [pick, show] = useKept('scope', 'answered');
  const part = answered.length > 0 && (waiting.length > 0 || newOpen('study')) ? pick : null;
  const tab = (id, label) => html`<button role="radio" aria-checked=${part === id} class=${cx(part === id && 'on')} onClick=${() => show(id)}>${label}</button>`;
  return html`<div class="page">
    <${PageHeader} nav="research"><${AddButton} label="New question" onClick=${() => { show('waiting'); openThing({ kind: 'study' }); }} /><//>
    ${part && html`<div class="seg scope" role="radiogroup" aria-label="Show">${tab('answered', 'Answered')}${tab('waiting', 'Waiting')}</div>`}
    ${part !== 'waiting' && answered.length > 0 && html`<${Answered} list=${answered} />`}
    ${part !== 'answered' && html`<${Picks} kind="study" list=${waiting} title=${!part && 'Waiting'} empty=${!answered.length} />`}
  </div>`;
}
/* The questions answered, folded so the one wanted is easy to find, the search box narrowing them by their words; a
   click unfolds one, marking it read (it was bold, and the rail had its dot), and folds the one open before, as opening
   a task does (kept while you're on the page, open while it's there: deleted, it left Back a layer with nothing to
   close). Esc, a phone's Back or a click elsewhere folds it, as anything open in place; not the Capture button (see
   OVER), so what's read can be captured and read on. */
function Answered({ list }) {
  const [find, setFind] = useKept('find', '');
  const words = find.trim().toLowerCase();
  const shown = list.filter(s => [s.title, s.note, s.answer].some(t => t.toLowerCase().includes(words)));
  const [unfolded, setUnfolded] = useKept('unfolded', null);
  const open = shown.some(s => s.id === unfolded) ? unfolded : null;
  /* The question pressed stays where it was on the screen as the one open before folds up (top: where); one folded
     otherwise, its answer read far down, comes back into sight. */
  const held = useRef(null), openLi = useRef(null);
  useLayoutEffect(() => {
    const h = held.current;
    if (h?.top != null) main().scrollTop += h.row.getBoundingClientRect().top - h.top;
    else h?.row.scrollIntoView({ block: 'nearest' });
    held.current = null;
  }, [unfolded]);
  const fold = s => e => {
    const row = e.currentTarget.closest('.chapter-h');
    held.current = { row, top: row.getBoundingClientRect().top };
    setUnfolded(unfolded === s.id ? null : s.id);
    patchItem(s.id, { read: true });
  };
  const shut = () => { const row = openLi.current?.querySelector('.chapter-h'); held.current = row && { row }; setUnfolded(null); };
  useLayer(open, shut);
  /* A press on another question is its fold's, which holds it in place: folded here first, the page jumped. */
  useClickAway(openLi, open, e => { if (!e.target.closest('.chapter-h')) shut(); });
  return html`<${Search} value=${find} set=${setFind} />
    <${Block}><ul class="list">${shown.map(s => html`<${Chapter} key=${s.id} s=${s} li=${open === s.id ? openLi : null} onFold=${fold(s)} onDelete=${() => deleteThing(s)} />`)}</ul><//>`;
}
/* A question answered: its row (a click folds or unfolds it; unfolded, its trash on its line), then what I
   asked, Claude's answer and where it comes from (only web links: the answer comes from outside SIByL). li: the open
   one's ref (see Answered). */
function Chapter({ s, li, onFold, onDelete }) {
  const links = s.sources.filter(x => /^https?:\/\//.test(x.url)), open = !!li;
  return html`<li ref=${li}>
    <div class="pick-row chapter-h" onClick=${opens(onFold)}>
      <div class="li-body"><button class=${cx('li-title', !s.read && 'unread')} aria-expanded=${open} onClick=${onFold}>${s.title}</button></div>
      ${open && html`<${Trash} cls="pick-del" label=${'Delete ' + s.title} onClick=${onDelete} />`}
      <span class="chev"><${Icon} name="right" size=${14} /></span>
    </div>
    ${open && html`<div class="chapter">${s.note && html`<div class="note">${linked(s.note)}</div>`}<${Prose} text=${s.answer} />
      ${links.length > 0 && html`<div class="sources">${links.map(x => html`<a href=${x.url} target="_blank" rel="noopener noreferrer"><${Icon} name="link" size=${13} />${x.title}</a>`)}</div>`}</div>`}
  </li>`;
}
/* Claude's answer, written in Markdown's plain parts: headings, paragraphs, - and 1. lists, **bold**, *italic*; a
   [link](…) keeps only its words (the sources hold the links). Drawn as text, so nothing in it becomes markup. */
const inline = t => t.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/)
  .map((p, i) => i % 2 ? (p.startsWith('**') ? html`<b>${p.slice(2, -2)}</b>` : html`<i>${p.slice(1, -1)}</i>`) : p);
function Prose({ text }) {
  const blocks = [];
  let gap = true;
  for (const line of text.split('\n')) {
    const t = line.trim(), last = blocks.at(-1), head = t.match(/^#+\s+(.*)/), item = t.match(/^(?:[-*•]|(\d+)[.)])\s+(.*)/);
    if (!t) { gap = true; continue; }
    if (head) blocks.push({ tag: 'h3', text: head[1] });
    else if (item) { const tag = item[1] ? 'ol' : 'ul'; if (last?.tag === tag) last.items.push(item[2]); else blocks.push({ tag, start: item[1], items: [item[2]] }); }
    else if (last?.tag === 'p' && !gap) last.text += ' ' + t;
    else blocks.push({ tag: 'p', text: t });
    gap = false;
  }
  return html`<div class="prose">${blocks.map(b => b.items
    ? html`<${b.tag} start=${b.start}>${b.items.map(x => html`<li>${inline(x)}</li>`)}<//>`
    : html`<${b.tag}>${inline(b.text)}<//>`)}</div>`;
}

/* ==== Calendar ('reminders' inside) ==== */
/* What's done once on its day (what repeats is Ticklers'; a next action's day is only a deadline: it's Next's), from
   tomorrow on (today is Next's). Its days, as OmniFocus's Forecast has them: Tomorrow first, as its Today, five days
   more, then Future (seven tiles, not eight, so "Tomorrow" stays readable on a phone). Each says how many things it
   holds: a tap shows only that day, again everything, a pane per day as the strip parts them; an empty one can't be
   picked. A day's pane is titled by its date, as OmniFocus's ("Tomorrow — Fri 6 Nov"), so its rows don't repeat it;
   Future's rows name theirs. A task dragged into another day's pane moves to that day, or dropped on a day's tile, last
   on that day (see startDrag). */
function RemindersView() {
  const [pick, setPick] = useKept('day', null);
  const t = todayISO(), next = [1, 2, 3, 4, 5, 6].map(n => addDays(t, n));
  const list = all('reminder').filter(r => r.date > t && !isRepeating(r) && !r.context && !onHold(r)).sort(byDue);
  const days = [
    ...next.map((d, i) => ({ id: d, label: i ? `${WD[parseDay(d).getDay()]} ${parseDay(d).getDate()}` : 'Tomorrow', title: (i ? '' : 'Tomorrow — ') + fmtWeekday(d), list: list.filter(r => r.date === d) })),
    { id: '', label: 'Future', title: 'Future', list: list.filter(r => r.date > next.at(-1)) },
  ];
  const day = days.find(d => d.id === pick && d.list.length);
  const tasks = useTaskRows(r => r.date > next.at(-1) && fmtWeekday(r.date));
  const adding = newOpen('reminder');
  return html`<div class="page" data-zone>
    <${PageHeader} nav="reminders"><${AddButton} label="New task" onClick=${() => openThing({ kind: 'reminder' })} /><//>
    ${list.length ? html`<div class="dates" role="group" aria-label="Days">${days.map(d => html`<button key=${d.id} class=${cx(day === d && 'on')} data-into=${d.id || undefined}
      aria-pressed=${day === d} disabled=${!d.list.length} onClick=${() => setPick(day === d ? null : d.id)}>${d.label}<b>${d.list.length}</b></button>`)}</div>` : !adding && html`<p class="empty">Nothing ahead.</p>`}
    ${adding && html`<${NewThing} />`}
    ${(day ? [day] : days.filter(d => d.list.length)).map(d => html`<${Block} key=${d.id} title=${d.title} data-lane=${d.id}>${tasks(d.list)}<//>`)}
  </div>`;
}

/* ==== The Sweep ('work' inside) ==== */
/* What an Inbox item can be once it can't be done now: the kind of thing it makes, which opens in its place as the
   pages' pluses open one, the Sweep's Save filing it (Next a next action, Calendar, Tickler and Someday a task: see
   kindOf); start(words): what a new one starts with, the item's words its name (the Calendar's day and a Tickler's
   start from tomorrow on, later: what's for today is a next action, due today; Someday's none), or a new project's next
   action (the project is what it's for: mostly a name the item doesn't have). Project first asks Which one?, in the
   choices' place, of a new one (fresh: its words) and those there are (into), the item the last line of one's support.
   */
const ANSWERS = [
  { id: 'next', label: 'Next', icon: 'clockDisc', color: 'var(--c-today)', kind: 'reminder', start: t => ({ title: t, date: '', next: true }) },
  { id: 'calendar', label: 'Calendar', icon: 'forecast', color: 'var(--c-reminders)', kind: 'reminder', start: t => ({ title: t, later: true }) },
  { id: 'tickler', label: 'Tickler', icon: 'repeat', color: 'var(--c-ticklers)', kind: 'reminder', start: t => ({ title: t, ...TICKLER, later: true }) },
  { id: 'project', label: 'Project', icon: 'project', color: 'var(--c-projects)', kind: 'project', start: t => ({ action: t }), into: () => inOrder('project'), fresh: 'New project…' },
  { id: 'someday', label: 'Someday', icon: 'someday', color: 'var(--c-someday)', kind: 'reminder', start: t => ({ title: t, date: '' }) },
  { id: 'study', label: 'Delegate', icon: 'stack', color: 'var(--c-research)', kind: 'study', start: t => ({ title: t }) },
];

/* OK, or Decide what it becomes. Its step (now, file: the choices, which: Which one?) is kept (useKept), so SIByL
   reopened mid-Sweep comes back to it. Space is OK (done, or not worth doing: either way it goes, so no trash), there
   while the item is (Decided, it can still be OK'd, without going back first), Esc the Decide beside it, Backspace
   the Back (data-kbd), a step at a time. Each step's bar is its own, so no button
   pressed there turns into the next step's (Decide into Back, still lit). Which one? and what it's filed as come in
   the choices' place under the choice picked (.chosen); what it's filed as alone (it starts from the item's words, so
   both showing said them twice; bar: Back drops it, Save files it). Esc leaves Which one? as it leaves what's open.
   Filed, Undo brings it back to the choices. */
function WorkItem({ it, left }) {
  const [step, setStep] = useKept(it.id + ':step', 'now');
  /* The choice picked last: Which one? asks for it, and back at the choices the › is on it again. */
  const [chose, setChose] = useKept(it.id + ':chose', null);
  const done = () => removeWithUndo(it, `Done: ${clip(it.text)}`, DONE_MANY, 'inbox-done');
  const file = a => o => fileItem(it, a.kind, o);
  const make = a => openThing({ kind: a.kind, ...a.start(it.text), answer: a, file: file(a) });
  const pick = a => { setChose(a.id); if (a.into) setStep('which'); else make(a); };
  const now = step === 'now', which = step === 'which' && ANSWERS.find(a => a.id === chose), o = !now && ui.open;
  useLayer(which, () => setStep('file'));
  const at = o ? 'edit' : step;
  const back = (kbd, onClick) => html`<button class="btn ghost" data-kbd=${kbd} onClick=${onClick}><${Icon} name="left" size=${16} />Back</button>`;
  const ok = html`<button class="btn primary" data-kbd="space" onClick=${done}><${Icon} name="check" size=${16} />OK</button>`;
  const bar = now
    ? html`<span class="spacer"></span><button class="btn" data-kbd="esc" onClick=${() => setStep('file')}>Decide</button>${ok}`
    : o ? html`${back(null, () => opened.drop())}<span class="spacer"></span><button class="btn primary" onClick=${() => opened.save()}>Save</button>`
    : html`${back('back', () => setStep(which ? 'file' : 'now'))}<span class="spacer"></span>${ok}`;
  return html`<div class="work-body">
      ${o ? html`<div class="work-step" key=${at}>
          <div class="eyebrow chosen">${face(o.answer)}</div>
          <${NewThing} bar />
        </div>` : html`
        <div class="eyebrow">Inbox · ${left === 1 ? 'the last one' : left + ' left'}</div>
        <h2 class="work-title"><${EditableText} value=${it.text} onSave=${text => patchItem(it.id, { text })} /></h2>
        ${which ? html`<div class="work-step" key=${at}>
            <div class="eyebrow chosen">${face(which)}</div>
            <${PickList} search options=${[{ id: NEW, label: which.fresh }, ...which.into().map(x => ({ id: x.id, label: x.title }))]}
              onPick=${x => x.id === NEW ? make(which) : file(which)({ id: x.id })} />
          </div>`
        : !now && html`<div class="work-step" key=${at}><${PickList} options=${ANSWERS} start=${chose} onPick=${pick} /></div>`}`}
    </div>
    <div class="bar" key=${at}>${bar}</div>`;
}

/* The Inbox one thing at a time, oldest first (begun by sweep, on an Inbox with something in it). Once the last one is
   gone through it's over: back on Next, the toast of what became of it (its Undo) left showing. Left by Stop (Shift +
   S), Back or the rail too; a closed tab reopens in it (useKept). */
function WorkView() {
  const items = all('inbox').sort(byCreated);
  const leave = () => navigate('today');
  useLayoutEffect(() => { if (!items.length) leave(); }, [items.length]);
  return html`<div class="page work">
    <button class="icon-btn work-stop" aria-label="Stop" data-kbd="stop" onClick=${leave}><${Icon} name="stop" size=${16} /></button>
    ${items.length > 0 && html`<${WorkItem} key=${items[0].id} it=${items[0]} left=${items.length} />`}
  </div>`;
}

/* ==== The window: Capture ==== */
/* The one window over the page at a time (ui.window), a tool rather than a page: × in its header, its buttons in its
   foot. It takes the keyboard (an [autofocus] box, a phone's keyboard rising too: typing is the point there) and
   hands it back to its opener as it closes; Esc, a phone's Back or a press on the dim page around it closes it (close),
   Enter is its done (see the keys). */
const closeWindow = () => setUI({ window: null });
function Window({ title, done, close, foot, children }) {
  const box = useRef(null), body = useRef(null);
  useLayer(true, close, done);
  useInSight(box, body);
  useEffect(() => {
    const from = document.activeElement;
    takeKeyboard(box.current);
    return () => { if (from.isConnected) from.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="scrim" onMouseDown=${e => { if (e.target === e.currentTarget) close(); }}>
    <div class="modal" role="dialog" aria-modal="true" aria-label=${title} tabindex="-1" ref=${box}>
      <header class="modal-h"><h2>${title}</h2><button class="icon-btn" aria-label="Close" data-tip="Close" onClick=${close}><${Icon} name="x" /></button></header>
      <div class="modal-b" ref=${body}>${children}</div>
      <footer class="modal-f">${foot}</footer>
    </div>
  </div>`;
}
/* Capture (C, a phone's round button, the installed app's Capture, a share: see the start): what's typed goes to the
   Inbox, a line an item. text: what it starts with. Its buttons: Cancel, then Add to Inbox. Closed with words in it,
   they're notSaved. */
const capture = text => setUI({ window: { Body: Capture, text } });
function Capture({ text = '' }) {
  const [v, setV] = useState(text);
  const add = () => {
    const n = addToInbox(v);
    if (!n) return;
    closeWindow();
    toast(n === 1 ? 'Added to Inbox' : `${n} items added to Inbox`);
  };
  const close = () => { closeWindow(); if (v.trim()) notSaved(add); };
  return html`<${Window} title="Capture" done=${add} close=${close} foot=${html`<span class="spacer"></span><button class="btn ghost" onClick=${close}>Cancel</button><button class="btn primary" onClick=${add} disabled=${!v.trim()}>Add to Inbox</button>`}>
    <${AutoTextarea} class="field" rows="4" value=${v} autofocus placeholder="What’s on your mind?" aria-label="Capture to Inbox" onInput=${e => setV(e.target.value)} />
  <//>`;
}
/* ==== History and Settings, at the rail's foot ==== */
/* The tasks ticked in the last days (see logDone), a pane a day as the Calendar's, the latest first: what my days
   went on. */
function HistoryView() {
  const t = todayISO();
  const done = all('done').filter(d => dayDiff(d.day, t) < HISTORY_DAYS).sort((a, b) => b.created - a.created);
  const title = d => { const n = dayDiff(d, t); return (n === 0 ? 'Today — ' : n === 1 ? 'Yesterday — ' : '') + fmtWeekday(d); };
  return html`<div class="page">
    <${PageHeader} nav="tools" icon="history" title="History" />
    ${done.length ? [...new Set(done.map(d => d.day))].map(d => html`<${Block} key=${d} title=${title(d)}><ul class="list">
      ${done.filter(x => x.day === d).map(x => html`<li key=${x.id} class="li"><span class="li-title">${x.title}</span></li>`)}
    </ul><//>`) : html`<p class="empty">Nothing done in the last ${HISTORY_DAYS} days.</p>`}
  </div>`;
}
/* What's set apart from the pages (see SETTINGS), each taking effect as it's changed, as a Mac's settings do; the
   contexts (docs of their own, as tasks name them: renamed, dragged into Next's order, added at their foot; one still
   holding tasks has no trash, as they'd have nowhere to show); Dropbox, where the devices' copies meet (see sync),
   connected or not; and backups: Download backup, or Restore from…, a toast saying how that went. Restore writes a backup's entries as they are (same id replaced, nothing deleted), with
   Undo. */
const HOURS = Array.from({ length: 13 }, (_, h) => ({ id: h, label: fmtTime(pad(h) + ':00') }));
const WEEKS = [1, 2, 3, 4].map(n => ({ id: n, label: n === 1 ? 'Every week' : `Every ${n} weeks` }));
const REVIEW_DAYS = [6, 0].map(d => ({ id: d, label: WD_LONG[d] }));
function SettingsView() {
  const file = useRef(null), contexts = inOrder('context'), tap = useTapped();
  /* Saved as the browser saves any download. */
  const download = () => {
    const data = JSON.stringify({ app: 'sybil', items: Object.values(store.items) }, null, 1);
    Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([data])), download: `sybil-backup-${todayISO()}.json` }).click();
  };
  const restore = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let d = null;
    try { d = JSON.parse(await f.text()); } catch { /* not JSON at all */ }
    if (!(d && d.app === 'sybil' && Array.isArray(d.items))) return toast('That file isn’t a SIByL backup.');
    const was = d.items.map(x => [x.id, store.items[x.id]]);
    d.items.forEach(put);
    toast(`Restored ${d.items.length} entries`, { undo: () => was.forEach(([id, x]) => x ? put(x) : removeItem(id)) });
  };
  return html`<div class="page">
    <${PageHeader} nav="tools" icon="settings" title="Settings" />
    <${Block} title="Inbox tickler"><${AutoTextarea} class="field" rows="3" aria-label="Inbox tickler" value=${setting('tickler')} onInput=${e => setSetting('tickler', e.target.value)} /><//>
    <${Block} title="Day"><div class="row"><span>Starts at</span><${Select} aria-label="Day starts at" options=${HOURS} value=${setting('dayStart')} onChange=${v => setSetting('dayStart', +v)} /></div><//>
    <${Block} title="Review"><div class="row"><${Select} aria-label="How often" options=${WEEKS} value=${setting('every')} onChange=${v => setSetting('every', +v)} />
      <span>on</span><${Select} aria-label="On" options=${REVIEW_DAYS} value=${setting('reviewDay')} onChange=${v => setSetting('reviewDay', +v)} /></div><//>
    <${Block} title="Contexts"><ul class="li-steps" data-zone>
      ${contexts.map(c => html`<${ListLine} key=${c.id} ...${tap(c.id)} text=${c.title} onSave=${title => patchItem(c.id, { title })} at=${c.id}
        onDelete=${!all('reminder').some(r => r.context === c.id) && (() => deleteThing(c))} onMove=${before => placeInList(contexts, c, before)} />`)}
      <${AddLine} hint="New context" onAdd=${lines => lines.forEach(title => makeThing('context', { title }))} />
    </ul><//>
    <${Block} title="Sync"><div class="row">${auth ? html`<button class="btn" onClick=${disconnect}>Disconnect Dropbox</button>` : html`<button class="btn" onClick=${connect}>Connect Dropbox</button>`}</div><//>
    <${Block} title="Backup"><div class="row"><button class="btn" onClick=${download}>Download backup</button><button class="btn" onClick=${() => file.current.click()}>Restore from…</button></div>
      <input ref=${file} type="file" accept="application/json,.json" hidden onChange=${restore} /><//>
  </div>`;
}

/* ==== The app ==== */
/* Ticklers: what repeats (a birthday, a show every Saturday, nails to cut), out of the Calendar's way, by when it next
   comes up, their steps folded, a new one weekly. Someday: what I might do one day, with no day set (Things' Someday),
   out of sight but at the Review, as an Inbox of its own (each a name: Picks' rows with a trash), in the order
   dragged, made a project when the day comes (see TaskEditor); under them, the projects on hold. */
const VIEWS = { today: TodayView, inbox: InboxView, work: WorkView, reminders: RemindersView, history: HistoryView, settings: SettingsView,
  ticklers: () => {
    const list = all('reminder').filter(isRepeating).sort(byDue), tasks = useTaskRows(r => fmtDay(r.date)), adding = newOpen('reminder');
    return html`<div class="page">
      <${PageHeader} nav="ticklers"><${AddButton} label="New tickler" onClick=${() => openThing({ kind: 'reminder', ...TICKLER })} /><//>
      ${adding && html`<${NewThing} />`}
      ${list.length ? html`<${Block} data-zone>${tasks(list)}<//>` : !adding && html`<p class="empty">Nothing repeats.</p>`}
    </div>`;
  },
  someday: () => { const hold = inOrder('project').filter(p => p.hold); return html`<div class="page">
    <${PageHeader} nav="someday"><${AddButton} label="New task" onClick=${() => openThing({ kind: 'reminder', date: '' })} /><//>
    <${Picks} kind="reminder" list=${all('reminder').filter(r => !r.date && !r.context).sort(byDue)} trash empty=${!hold.length && 'Nothing for someday.'} />
    <${Picks} kind="project" list=${hold} title="Projects" icon="projects" empty=${false} />
  </div>`; },
  projects: () => html`<div class="page">
    <${PageHeader} nav="projects"><${AddButton} label="New project" onClick=${() => openThing({ kind: 'project' })} /><//>
    <${Picks} kind="project" list=${inOrder('project').filter(p => !p.hold)} />
  </div>`, research: ResearchView };
function App() {
  useLayoutEffect(() => { main().scrollTop = scrollTo; }, [route]);
  const View = VIEWS[route.view];
  const t = shownToast;
  return html`<div class="app">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false" dangerouslySetInnerHTML=${{ __html: ART_DEFS }}></svg>
    <${Sidebar} />
    <header class="topbar"><${Tools} /></header>
    <main class="main" key=${route.view}>
      <${View} />
    </main>
    ${route.view !== 'inbox' && html`<button class="fab" aria-label="Capture to Inbox" data-tip="Capture to Inbox" onClick=${() => capture()}><${Icon} name="capture" size=${26} /></button>`}
    ${ui.window && html`<${ui.window.Body} ...${ui.window} />`}
    ${ui.splash && html`<${Splash} key=${ui.splash.words} ...${ui.splash} />`}
    <div class="toasts" aria-live="polite">${t && html`<div class="toast" key=${t.id}>
      <span>${t.msg}</span>
      ${t.undo && html`<button onClick=${() => { t.undo(); dismissToast(t.id); }}>Undo</button>`}
      <button aria-label="Dismiss" data-tip="Dismiss" onClick=${() => dismissToast(t.id)}><${Icon} name="x" size=${14} /></button>
    </div>`}</div>
  </div>`;
}

/* Every key SIByL answers, in one place, once the box being typed in (typing) and a list's cursor (PickList) have
   had theirs. Esc closes the newest thing open, else lets go of the box on the page (as a browser's address bar).
   Enter is the Done of what's open (a window, a thing open in place) wherever the keyboard is in it, as Return is a
   Mac dialog's default button and Space presses the button the keyboard is on (Enter on a day of the week toggled it
   instead of saving); not where it types (Shift + Enter in a box taking several starts a line) or opens words for
   editing. Ctrl or ⌘ + Enter is it from anywhere. A press a moment later, once the box has kept its words (a step). The
   rest are the page's, not while typing or with a window or thing open: a button a key presses carries data-kbd
   (the Sweep's OK, Decide and Stop; Space on a button Tab is on presses that one instead), else C captures, Shift + S
   starts the Sweep (see sweep; in it, Stop is Shift + S), 1 to 9 jump to sections and Backspace goes back (goBack). Esc
   and Backspace stay SIByL's where they do nothing, so the browser never acts on them (Backspace has been its Back,
   and has scrolled the page). */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target, typed = t.matches('input, textarea, select'), top = layers.at(-1)?.current, mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape' && top) { e.preventDefault(); return top.close(e); }
  if (e.key === 'Enter' && top?.done) {
    if (e.repeat || (!mod && (t.matches('a, [role=button], input[type=file]') || (e.shiftKey && t.matches('textarea:not([enterkeyhint=done])'))))) return;
    e.preventDefault();
    return setTimeout(() => layers.at(-1)?.current.done?.());
  }
  if (e.key === 'Escape' && typed) { e.preventDefault(); return t.blur(); }
  if (mod || e.altKey || typed || (e.key === ' ' && t.matches('button'))) return;
  if (e.key === 'Escape' || e.key === 'Backspace') e.preventDefault();
  if (ui.window || opened) return;
  const kbd = { ' ': 'space', Escape: 'esc', S: 'stop' }[e.key], press = kbd && document.querySelector(`[data-kbd="${kbd}"]`);
  if (press) { e.preventDefault(); if (!e.repeat) press.click(); }
  else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); capture(); }
  else if (e.key === 'S') { e.preventDefault(); sweep(); }
  else if (/^[1-9]$/.test(e.key) && NAV[e.key - 1]) { e.preventDefault(); navigate(NAV[e.key - 1].id); }
  else if (e.key === 'Backspace' && !e.shiftKey && !e.repeat) goBack();
});
/* A phone's Back puts its keyboard away but leaves the box focused, and the tabs stepped aside for nothing (see .app):
   as the frame grows back by a keyboard's height (more than a browser bar's), the box is let go, as Esc lets go. */
let tall = innerHeight;
addEventListener('resize', () => {
  if (touching() && innerHeight - tall > 150) document.activeElement.blur();
  tall = innerHeight;
});
/* A redraw a minute while in view, and one on return, keep today and what's due current, and it syncs again (see
   watch). Going out of sight, what's not pushed yet goes, and the Sweep under way is put by (see route). */
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { refresh(); return watch(); }
  unwatch();
  if (store.unpushed) syncNow();
  localStorage.setItem('sybil.work', JSON.stringify(route.view === 'work' ? route.kept : null));
});
addEventListener('online', () => { unwatch(); watch(); refresh(); });
addEventListener('offline', refresh);
/* Leaving with changes Dropbox hasn't had yet asks first, in the browser's own words, as Google Keep does (the user's
   ask, 2026-11-20). */
addEventListener('beforeunload', e => { if (auth && store.unpushed) e.preventDefault(); });

/* Inter comes in parts by script (Google's subsets), each fetched the first time a page shows one of its letters, and
   that page then drew its words late (Ticklers' and Research's ă, ș, ț): every part the lists need is fetched
   at the start. The copy is asked to stay when the browser runs short of room. */
document.fonts.load('1em Inter', JSON.stringify(store.items));
navigator.storage.persist();
/* What the address brings, read once as SIByL starts and cleared (before hold adds its history entry): Dropbox's
   sign-in coming back (code); the installed app's Capture (its icon held: capture); something shared to SIByL from
   another app (title, text, url), which Capture holds as one line (one item), leaving out a link the text holds. */
const asked = new URLSearchParams(location.search);
if (location.search) history.replaceState(null, '', home);
if (asked.has('code')) signedIn(asked.get('code'));
const shared = ['title', 'text', 'url'].map(k => asked.get(k)).filter((x, i, all) => x && !(i === 2 && all[1]?.includes(x)));
if (asked.has('capture') || shared.length) capture(oneLine(shared.join(' ')));
/* Offline (see sw.js); none over plain http. */
navigator.serviceWorker?.register('sw.js');
refresh();
watch();
});
</script>
