  if (r.project && ui.open?.id === r.project) return html`<${PickEditor} key=${r.project} old=${store.items[r.project]} next=${ui.open.next} />`;
  const own = OWN[r.id], go = own ? sweep : () => openThing({ id: r.project || r.id }), p = store.items[r.project], due = dueOf(r);
  const c = store.items[r.context], [icon, from] = (p ? ['project', p.title + (p.due ? ` · ${dueOn(p.due)}` : '')] : next ? !own && r.date && (isRepeating(r) ? ['repeat', 'Ticklers'] : ['forecast', 'Calendar']) : c && [null, c.title]) || [];
  const drag = { ...draggable(r.id, (...aim) => dropTask(r.id, ...aim)), 'data-lane': next ? r.context : r.date, 'data-set': dayOf(r) };
  return html`<li key=${r.id}><div class="li task-row tappable" onClick=${opens(go)} ...${!own && drag}>
    <button class="li-title" onClick=${go}>${r.title}</button>
    <div class="task-side">
      ${isRepeating(r) && html`<span class="task-rule"><${Icon} name="repeat" size=${12} />${isLast(r) ? html`<b class="last">Last one</b>` : repeatShort(r.repeat)}</span>`}<br />
      <span class=${cx('task-when', due)}>${day(r)}</span>
    </div>
    <span class="task-from">${icon && html`<${Icon} name=${icon} size=${12} />`}${from}</span>
    <${DoneButton} label=${'Done: ' + r.title} due=${due} onClick=${() => completeTask(r)} />
  </div></li>`;
})}</ul>`;

/* ==== Navigation ==== */
/* The rail, in order; the number keys follow it: what's next, what comes in, then where the Sweep files it. Seven at
   most: more crowd a phone's bar. The Sweep isn't on it: the Inbox's broom (Shift + S) enters it. */
const NAV = [
  { id: 'next', label: 'Next' },
  { id: 'inbox', label: 'Inbox' },
  { id: 'calendar', label: 'Calendar' },
  { id: 'ticklers', label: 'Ticklers' },
  { id: 'projects', label: 'Projects' },
  { id: 'someday', label: 'Someday' },
  { id: 'research', label: 'Research' },
];
/* SIByL opens on Next, or where the Sweep had got to if it was left mid-Sweep (a tab closed by a slip; saved on
   visibilitychange in browser storage, sybil.sweep). kept: how the page is showing (see useKept). */
let route = { view: 'next', kept: {} };
const kept = JSON.parse(localStorage.getItem('sybil.sweep'));
if (kept) route = { view: 'sweep', kept };
/* Where you've been, restoring scroll and kept as a browser does, never into the Sweep. Going to another page drops
   what's open in place (a click on the rail saved it first). */
const trail = [];
let scrollTo = 0;
function navigate(view, back) {
  if (!back && view !== route.view && route.view !== 'sweep') {
    trail.push({ ...route, scroll: main().scrollTop });
  }
  scrollTo = back ? back.scroll : 0;
  route = { view, kept: back ? back.kept : view === route.view ? route.kept : {} };
  ui.open = null;
  refresh();
}
/* Back (Backspace, a browser's or phone's Back): the Back on screen (the Sweep's), else the page you came from. */
function goBack() {
  const b = document.querySelector('[data-kbd=back]');
  if (b) return b.click();
  const r = trail.pop();
  if (r) navigate(r.view, r);
}
/* A browser's or phone's Back goes back in SIByL, after closing what's open on top (a thing open in place keeps its
   changes: see useLayer), and leaves it only from where there's nothing to go back to, as from any page. SIByL holds
   one entry of the browser's history for it, from the first press (a browser skips one added before). */
let held = false;
const hold = () => { if (!held) { held = true; history.pushState(null, ''); } };
addEventListener('click', hold, true);
addEventListener('keydown', hold, true);
addEventListener('popstate', () => {
  held = false;
  if (layers.length) { const top = layers.at(-1).current; (top.back || top.close)(); }
  else if (document.querySelector('[data-kbd=back]') || trail.length) goBack();
  else return history.back();
  hold();
});
/* window: Capture, the one window, is over the page. open: what's open in place, its row turned
   into its editor: { id } of a thing there is (next: a project whose next action was ticked), or a new one as it
   starts ({ kind, ... }: at the top of its list, or in the place of the Sweep's item; with an id, in that thing's
   place: a Someday task made a project). splash: a word a moment over the page (see Splash). */
const ui = { window: false, open: null, splash: null };
function setUI(patch) { Object.assign(ui, patch); refresh(); }
/* The thing open in place, if any (see useOpened): its save and drop. */
let opened = null;
/* One at a time: the one open is saved first, and stays open if it can't be. key: each new one is drawn afresh, even
   where the one just saved stood. */
function openThing(o) { if (!opened || opened.save()) setUI({ open: { ...o, key: uid() } }); }

/* The Sweep (Shift + S, the Inbox's Sweep, the Sweep's own task), its broom a moment over it as it begins; with
   nothing in the Inbox, nothing to sweep: a moment's word that it's empty, over the page you're on. */
function sweep() {
  const some = all('inbox').length > 0;
  if (some) navigate('sweep');
  setUI({ splash: some ? { art: 'sweep', words: 'Sweep' } : { art: 'inbox', words: 'Inbox is empty' } });
}
/* A section's icon and a word in its colour, over the page a moment, then gone (a click sends it at once). */
function Splash({ art, words }) {
  useEffect(() => { const t = setTimeout(() => setUI({ splash: null }), 800); return () => clearTimeout(t); }, []);
  return html`<div class="splash" style=${tint(art)} onClick=${() => setUI({ splash: null })}><div><${Art} id=${art} size=${84} /><b>${words}</b></div></div>`;
}

/* How this device's copy stands with Dropbox, in words only (the user's asks: a dot on the gear was ambiguous; a
   cloud and a hover light looked pressable): All synced, or Syncing… while Dropbox hasn't had a change; in red, what
   keeps it from Dropbox: No network, Not synced (see failed), Signed out (by Dropbox: see signOut). Nothing while
   not connected. Each is at least as wide as the History and Settings marks under it on the rail (47.6px of ink,
   measured), so they don't stick out past its ends (the user disliked that, and letters spread to fit). */
function SyncState() {
  if (auth === null) return null;
  const [word, bad] = auth === false ? ['Signed out', 1] : !navigator.onLine ? ['No network', 1] : stuck ? ['Not synced', 1] : [store.unpushed ? 'Syncing…' : 'All synced'];
  return html`<span class=${cx('sync', bad && 'bad')}>${word}</span>`;
}
/* How it syncs, then History and Settings, pages off the rail (no number key): at the rail's foot or in a phone's top
   bar. */
const Tools = () => html`<${SyncState} /><button class="icon-btn" aria-label="History" onClick=${() => navigate('history')}><${Icon} name="history" /></button>
  <button class="icon-btn" aria-label="Settings" onClick=${() => navigate('settings')}><${Icon} name="gear" /></button>`;
function Sidebar() {
  const inboxN = all('inbox').length;
  const waits = { inbox: inboxN > 0 && `Inbox, ${inboxN} waiting`, research: all('question').some(s => s.answered && !s.read) && 'Research, a new answer' };
  return html`<aside class="sidebar" aria-label="Sections">
    <nav class="nav">
      ${NAV.map(n => { const on = route.view === n.id, flag = waits[n.id]; return html`
        <button key=${n.id} class=${cx('nav-item', on && 'on')} style=${tint(n.id)} aria-label=${flag || n.label}
          aria-current=${on ? 'page' : null} onClick=${() => navigate(n.id)}>
          <span class="nav-ico"><${Art} id=${n.id} size=${30} />${flag && html`<span class="nav-flag" aria-hidden="true"></span>`}</span>
          <span class="nav-label">${n.label}</span>
        </button>`; })}
    </nav>
    <div class="side-foot"><${Tools} /></div>
  </aside>`;
}

/* ==== Next ==== */
/* A pane per context, in Settings' order, and first, untitled, what has none: the app's own tasks (OWN) and any task
   not given one yet. In each, the tasks with a day by that day (dayOf: a Calendar task or Tickler from when it
   shows, a next action by its deadline), then those with none in the order dragged (the user's ask). A next action
   shows from the moment it's made, unless its project is on hold. Things leave only by being done: one missed waits
   here, its day red, until ticked. A task dragged into another pane takes its context. */
function NextView() {
  const t = todayISO();
  /* The app's own tasks, sorted as tasks due on their day (first of that day's), until ticked. */
  const own = Object.entries(OWN).map(([id, o]) => ({ id, title: o.title, date: ownDay(id, t), repeat: o.repeat(), order: -1 })).filter(r => r.date);
  const shown = [...own, ...all('task').filter(r => !onHold(r) && kindOf(r) !== 'someday' && (!r.date || dayDiff(t, r.date) <= r.ahead))];
  const contexts = inOrder('context'), ids = new Set(contexts.map(c => c.id));
  const panes = [{ id: '', list: shown.filter(r => !ids.has(r.context)) }, ...contexts.map(c => ({ id: c.id, title: c.title, list: shown.filter(r => r.context === c.id) }))];
  /* Every row's day, Today too, whatever it came from (the user's ask: a pane mixes them, so none says when). */
  const tasks = taskRows(r => dayOf(r) && fmtDay(dayOf(r)), true);
  const adding = newOpen('task');
  return html`<div class="page next" data-zone>
    <${PageHeader} nav="next"><${AddButton} label="New next action" onClick=${() => openThing({ kind: 'task', date: '', next: true })} /><//>
    ${adding && html`<${NewThing} />`}
    ${panes.map(({ id, title, list }) => list.length > 0 && html`<${Block} key=${id} title=${title} data-lane=${id || undefined}>
      ${tasks([...list.filter(dayOf).sort(byDay), ...list.filter(r => !dayOf(r)).sort(byOrder)])}
    <//>`)}
    ${!shown.length && !adding && html`<p class="empty">Nothing next.</p>`}
  </div>`;
}

/* ==== Plain lists ==== */
/* A plain list's line (the Inbox's, a project's info, a context): its words renamed in place; its tools brought out
   over it by a mouse, or by a finger tapping it open (see useTapped): its trash, unless it can't go (a context holding
   tasks); onUp's ↑ first (an info made the next action: see PickEditor); with onMove, dragged to another place in its
   list ([data-zone]) as a project is, at its place there (at). */
const ListLine = ({ open, onClick, text, onSave, verb = 'Delete', onDelete, onUp, at, onMove }) => html`<li class=${cx('line-row hov', open && 'open')} onClick=${onClick} ...${onMove && draggable(at, onMove)}>
  <div class="li-body"><${EditableText} cls="line-title" value=${text} onSave=${onSave} /></div>
  ${onUp && html`<button class="icon-btn reveal" aria-label=${'Make it next: ' + text} data-tip="Make it next" onClick=${onUp}><${Icon} name="up" size=${15} /></button>`}
  ${onDelete && html`<${Trash} cls="reveal" label=${verb + ' ' + text} tip=${verb} onClick=${onDelete} />`}
</li>`;
/* tap(key) gives a row its open and onClick. A press on another row is left to its tap; one on a button (its own
   trash or circle too) or elsewhere on the page (not on what floats over it: OVER), Esc or a drag closes it, as the
   press lands or, for a scroll, as it ends: a row gone while open left Back a layer with nothing to close. */
function useTapped() {
  const [tapped, setTapped] = useState(null);
  useLayer(tapped, () => setTapped(null));
  useEffect(() => {
    if (!tapped) return;
    let live = true;
    const close = () => { if (live) setTapped(null); };
    const away = e => { const t = e.target; if ((!t.closest('.hov') || t.closest('button')) && !t.closest(OVER)) onPressEnd(close); };
    document.addEventListener('pointerdown', away);
    addEventListener('lift', close);
    return () => { live = false; document.removeEventListener('pointerdown', away); removeEventListener('lift', close); };
  }, [tapped]);
  return k => ({ open: tapped === k, onClick: opens(() => { if (touching()) setTapped(t => t === k ? null : k); }) });
}
/* A list's line that adds to it (an open project's infos, Settings' contexts): Enter or a press elsewhere adds what's
   typed, a line each (onAdd gets them), and stays (Enter with nothing typed is what's open's Done); Esc drops it
   (notSaved). icon: its mark, as every field of an open thing has one. */
function AddLine({ hint, icon, onAdd }) {
  const [draft, setDraft] = useState('');
  const box = useRef(null), dropped = useRef(false);
  const add = text => { onAdd(splitLines(text)); setDraft(''); };
  return html`<li><div class="add-row" onClick=${() => box.current.focus()}>
    ${icon && mark('add-' + icon, icon)}<${AutoTextarea} id=${icon && 'add-' + icon} inputRef=${box} value=${draft} placeholder=${hint} aria-label=${hint} onInput=${e => setDraft(e.target.value)}
      onKeyDown=${typing({ done: draft.trim() && (() => add(draft)), esc: e => { dropped.current = true; setDraft(''); e.target.blur(); if (draft.trim()) notSaved(() => add(draft)); } })}
      onBlur=${() => { const text = draft; if (dropped.current) dropped.current = false; else if (text.trim()) onPressEnd(() => add(text)); }} />
    <span class="add-ico"><${Icon} name="plus" size=${16} /></span>
  </div></li>`;
}
/* An open project's infos: Add info first, always in one place (at the foot it moved with their number: the user's
   ask), adding a line each at the end; then a line counting them that folds them (unfolded at first); each renamed,
   removed or dragged in place, its ↑ (onUp) swapping it with the next action's words. onChange takes a function of
   the list, so pasted lines all count. */
function InfoList({ list, onChange, onUp }) {
  const tap = useTapped();
  const [open, setOpen] = useState(true);
  return html`<ul class="lines" data-zone>
    <${AddLine} key="add" hint="Add info…" icon="info" onAdd=${lines => onChange(l => [...l, ...lines])} />
    ${list.length > 0 && html`<li key="fold" class="fold"><button class="line-btn" aria-expanded=${open} onClick=${() => setOpen(!open)}>${`${list.length} ${plural(list.length, 'info')}`}<span class="chev"><${Icon} name="right" size=${14} /></span></button></li>`}
    ${open && list.map((t, n) => html`<${ListLine} key=${n} ...${tap('info' + n)} text=${t} onSave=${v => onChange(l => l.map((x, i) => i === n ? v : x))}
      verb="Remove" onDelete=${() => onChange(l => l.filter((_, i) => i !== n))} onUp=${() => onUp(n)} at=${n} onMove=${before => onChange(l => moveBefore(l, n, before == null ? null : +before))} />`)}
  </ul>`;
}

/* ==== Inbox ==== */
/* What's captured, a line an item; from elsewhere (see gather), at the capture's time, so captures keep their order,
   and with its name (stem) for its lines' ids, <stem>-<line>, so one that comes twice is made once. */
function addToInbox(text, at = Date.now(), stem) {
  const lines = splitLines(text);
  lines.forEach((text, i) => { const id = stem && `${stem}-${i}`; if (!stem || !(id in store.items || id in store.gone)) newItem('inbox', { text, created: at + i }, id); });
  return lines.length;
}
/* The Inbox only collects; going through it is the Sweep's. Here a thing can only be renamed or deleted. */
function InboxView() {
  const [draft, setDraft] = useState('');
  const tickler = setting('tickler').trim();
  const items = all('inbox').sort(byCreated);
  const tap = useTapped();
  const add = () => { if (addToInbox(draft)) setDraft(''); };
  return html`<div class="page">
    <${PageHeader} nav="inbox"><button class="btn" onClick=${sweep}><${Art} id="sweep" size=${18} />Sweep</button><//>
    ${tickler && html`<p class="note tickler">${linked(tickler)}</p>`}
    <div class="capture-box">
      <${AutoTextarea} value=${draft} rows="2" placeholder="Type or paste. Each line becomes its own item." aria-label="New inbox items"
        onInput=${e => setDraft(e.target.value)} onKeyDown=${typing({ done: add })} />
      <button class=${cx('send-btn', draft.trim() && 'ready')} aria-label="Add to Inbox" onMouseDown=${holdFocus} onClick=${add}><${Icon} name="up" size=${16} /></button>
    </div>
    ${items.length ? html`<div class="panel"><ul class="list">${items.map(it => html`<${ListLine} key=${it.id} ...${tap(it.id)}
      text=${it.text} onSave=${text => patchItem(it.id, { text })} onDelete=${() => deleteThing(it)} />`)}
    </ul></div>` : html`<div class="inbox-zero" role="img" aria-label="Inbox zero"><svg viewBox="2 3 24 21.86" aria-hidden="true"><path fill-rule="evenodd" d=${TRAY_THIN} /></svg></div>`}
  </div>`;
}

/* ==== Projects and questions ==== */
/* What's wrong with an open thing, under its name. */
const Status = ({ error }) => error && html`<p class="err" role="alert">${error}</p>`;
/* A thing open in place's Delete (a task's, a project's, a question's): a can on its name's line, left of its circle
   or ring (a question's at its row's end, where a circle would be), as big as the circle (the user's design). */
const DeleteButton = ({ old, drop }) => html`<button class="del-btn" aria-label=${'Delete ' + old.title} data-tip="Delete" onClick=${() => { drop(); deleteThing(old); }}><${Icon} name="can" size=${32} /></button>`;
/* A project or question open in place: one there is (old), or a new one (initial; its file says how it's made, else
   addThing). A project opens in parts (the user's ask: what's what at a glance): its name, with its Delete (its next
   action goes too) and its hold where a task's circle is, then its due day; under a line its next action, written a
   task's way (taskFields, When, taskOf), then Don't show until (a day it's held until: see isHeld); under a line its
   infos, one of which ↑ swaps with the next action's words, so only one is ever next and nothing typed is lost.
   next: its next action was ticked (completeTask), so the next one is written, in the last one's context, or Project
   done (a done circle in the hold's place: the user's ask) ends it; saved, the old one is ticked, with Undo; Esc, or nothing written, ticks nothing. A question opens as
   an answered one unfolds: its name, its description, its Delete at its row's end. bar: see useOpened. */
function PickEditor({ old, initial, next, bar }) {
  const it = old || initial, { label } = PICKS[it.kind], project = it.kind === 'project', was = old && project && actionOf(old);
  /* Its next action as it is, or as it starts (a new project's maybe the Sweep's item: see ANSWERS). */
  const at = (!next && was) || { project: old?.id || 'new', date: '' };
  const [title, setTitle] = useState(it.title || '');
  const [note, setNote] = useState(it.note || '');
  const [infos, setInfos] = useState(it.infos || []);
  const [act, setAct] = useState(() => taskFields(next ? { context: was.context, date: '' } : was || { date: '', title: it.action }));
  /* The day it's held until, while it is (one passed, or a hold by hand, isn't a day to show), and the day it's due. */
  const [until, setUntil] = useState(old && old.hold !== true && isHeld(old) ? old.hold : '');
  const [due, setDue] = useState(it.due || '');
  const setA = k => v => setAct(f => ({ ...f, [k]: v }));
  const up = i => { const words = oneLine(act.title); setInfos(l => words ? l.toSpliced(i, 1, words) : l.toSpliced(i, 1)); setA('title')(infos[i]); };
  const tick = () => { removeItem(was.id); logDone(was); };
  /* The last day it can be held until: its next action's and its own due day (none left: no Don't show until). */
  const t = todayISO(), last = earliest(act.due, due);
  const { box, error, save, drop } = useOpened({ old, bar, draft: JSON.stringify([title, note, infos, act, until, due]), save: fail => {
    if (!oneLine(title)) return fail('Give it a name.');
    const n = project && (oneLine(act.title) ? taskOf(act, at) : 'Give it a next action.');
    /* Typed past what the pickers allow (see When): what would disagree. */
    const a = project && n.due, wrong = typeof n === 'string' ? n : tooEarly(until, addDays(t, 1)) || tooEarly(due, t, old?.due)
      || (a && a < until && 'Its next action would be due before it shows.') || (due && a > due && 'Its next action would be due after the project.')
      || (due && until > due && 'The project would be due before it shows.');
    if (wrong) return fail(wrong);
    /* Held until a day picked, else as it was by hand. */
    const h = { title: oneLine(title), ...(project ? { infos, due, hold: until || old?.hold === true } : { note: note.trim() }) };
    const said = until && until !== old?.hold && `On hold until ${fmtDay(until)}`;
    if (next) doneToast(said || `Done: ${clip(was.title)}`, undoable(() => { tick(); makeThing('task', n); patchItem(old.id, h); }));
    else if (old) {
      patchItem(old.id, h);
      if (was && JSON.stringify(act) !== JSON.stringify(taskFields(was))) patchItem(was.id, n);
      if (said) toast(said);
    } else {
      const made = it.file ? it.file(h) : addThing(it.kind, h);
      if (project) makeThing('task', { ...n, project: made.id });
    }
    return true;
  } });
  const hold = () => {
    if (!save()) return;
    const p = store.items[old.id];
    toast(isHeld(p) ? 'Resumed' : 'Put on hold', { undo: undoable(() => patchItem(p.id, { hold: !isHeld(p) })) });
  };
  const finish = () => {
    drop();
    doneToast(`Done: ${clip(old.title)}`, undoable(() => { tick(); removeItem(old.id); }));
  };
  const holds = old && isHeld(old) ? 'Resume' : 'Put on hold';
  return html`<li class="editing" ref=${box} tabindex="-1"><div class="pick-row">
    <div class="li-body edit-b">
      ${project ? html`<div class="name-line"><div class="li-body"><${Name} label=${label} value=${title} onInput=${setTitle} /></div>
          ${next ? html`<${DoneButton} label="Project done" due=${dueOf(old)} onClick=${finish} />`
            : old && html`<${DeleteButton} old=${old} drop=${drop} /><button class="ring-btn" aria-pressed=${isHeld(old)} aria-label=${holds} data-tip=${holds} onClick=${hold}><${Icon} name=${isHeld(old) ? 'play' : 'pause'} size=${18} /></button>`}</div>
        <${Status} error=${error} />
        <div class="when"><${DayRow} id="project-due" icon="project" label="Project due" value=${due} low=${latest(t, act.due, until)} was=${old?.due} set=${setDue} /></div>
        <div class="edit-b">
          <div class="row act">${mark('act-title', 'next')}<${AutoTextarea} line id="act-title" class="words" autofocus=${!!it.title && !oneLine(act.title) && !touching()} aria-label="Next action"
            placeholder="Next action" value=${act.title} onInput=${e => setA('title')(e.target.value)} /></div>
          <div class="when"><${When} f=${act} set=${setA} it=${at} after=${until} before=${due} />
            ${(until || !last || addDays(t, 1) <= last) && html`<${DayRow} id="project-until" icon="pause" label="Don’t show until" value=${until} low=${addDays(t, 1)} high=${last} set=${setUntil} />`}</div>
        </div>
        <${InfoList} list=${infos} onChange=${setInfos} onUp=${up} />`
      : html`<${Name} label=${label} value=${title} onInput=${setTitle} />
        <${Status} error=${error} />
        <${Words} class="note" aria-label="Description" placeholder="Add description" value=${note} onInput=${e => setNote(e.target.value)} />`}
    </div>
    ${old && !project && html`<${DeleteButton} old=${old} drop=${drop} />`}
  </div></li>`;
}

/* Things in a pane (title: its heading): projects, questions waiting, Someday's tasks. A click opens one in place
   (with o.kind, a thing being made of it: a Someday task made a project), a drag moves it in its list; under each
   name its sub (PICKS), else its description. trash: a trash at the row's end, as an Inbox item's (Someday is an
   Inbox of what might be done one day). A new one opens over the list (NewThing). empty: what to say when there are
   none and none is being made (true: "No projects yet."). */
function Picks({ kind, list, title, trash, empty }) {
  const sub = PICKS[kind]?.sub || (h => h.note), o = ui.open;
  if (!list.length) return !newOpen(kind) && empty && html`<p class="empty">${empty === true ? `No ${MANY[kind]} yet.` : empty}</p>`;
  return html`<${Block} title=${title}>
    <ul class="list" data-zone>${list.map(h => {
      if (o?.id === h.id) return o.kind ? html`<${editorOf(o.kind)} key=${o.key} initial=${o} />` : html`<${editorOf(kind)} key=${h.id} old=${h} />`;
      const go = () => openThing({ id: h.id }), line = sub(h);
      return html`<li key=${h.id}>
      <div class=${cx('pick-row tappable', trash && 'hov')} onClick=${opens(go)} ...${draggable(h.id, before => placeInList(list, store.items[h.id], before))}>
        <div class="li-body"><button class="li-title" onClick=${go}>${h.title}</button>${line && html`<div class="note">${linked(line)}</div>`}</div>
        ${trash && html`<${Trash} cls="pick-del reveal" label=${'Delete ' + h.title} onClick=${() => deleteThing(h)} />`}
      </div>
    </li>`; })}</ul>
  <//>`;
}

/* ==== Research ==== */
/* Answered (every question answered, newest first) or Waiting (the questions to research, in their order), one at a
   time once there are both: a segmented control picks (part: the one showing, null while there's only one), Answered
   unless Waiting was picked while on the page, as a new question does. Answers stay until deleted: the page is a
   manual. */
function ResearchView() {
  const questions = inOrder('question'), waiting = questions.filter(s => !s.answered);
  const answered = questions.filter(s => s.answered).sort((a, b) => b.answered.localeCompare(a.answered));
  const [pick, show] = useKept('scope', 'answered');
  const part = answered.length > 0 && (waiting.length > 0 || newOpen('question')) ? pick : null;
  const tab = (id, label) => html`<button role="radio" aria-checked=${part === id} class=${cx(part === id && 'on')} onClick=${() => show(id)}>${label}</button>`;
  return html`<div class="page">
    <${PageHeader} nav="research"><${AddButton} label="New question" onClick=${() => { show('waiting'); openThing({ kind: 'question' }); }} /><//>
    ${part && html`<div class="seg scope" role="radiogroup" aria-label="Show">${tab('answered', 'Answered')}${tab('waiting', 'Waiting')}</div>`}
    ${part !== 'waiting' && answered.length > 0 && html`<${Answered} list=${answered} />`}
    ${part !== 'answered' && html`${newOpen('question') && html`<${NewThing} />`}<${Picks} kind="question" list=${waiting} title=${!part && 'Waiting'} empty=${!answered.length} />`}
  </div>`;
}
/* The questions answered, folded so the one wanted is easy to find, the search box narrowing them by their words; a
   click unfolds one, marking it read (it was bold, and the rail had its dot), and folds the one open before, as opening
   a task does (kept while you're on the page, open while it's there: deleted, it left Back a layer with nothing to
   close). Esc, a phone's Back or a click elsewhere folds it, as anything open in place; not the Capture button (see
   OVER), so what's read can be captured and read on. */
function Answered({ list }) {
  const [find, setFind] = useKept('find', '');
  const words = find.trim().toLowerCase();
  const shown = list.filter(s => [s.title, s.note, s.answer].some(t => t.toLowerCase().includes(words)));
  const [unfolded, setUnfolded] = useKept('unfolded', null);
  const open = shown.some(s => s.id === unfolded) ? unfolded : null;
  /* The question pressed stays where it was on the screen as the one open before folds up (top: where); one folded
     otherwise, its answer read far down, comes back into sight. */
  const held = useRef(null), openLi = useRef(null);
  useLayoutEffect(() => {
    const h = held.current;
    if (h?.top != null) main().scrollTop += h.row.getBoundingClientRect().top - h.top;
    else h?.row.scrollIntoView({ block: 'nearest' });
    held.current = null;
  }, [unfolded]);
  const fold = s => e => {
    const row = e.currentTarget.closest('.chapter-h');
    held.current = { row, top: row.getBoundingClientRect().top };
    setUnfolded(unfolded === s.id ? null : s.id);
    patchItem(s.id, { read: true });
  };
  const shut = () => { const row = openLi.current?.querySelector('.chapter-h'); held.current = row && { row }; setUnfolded(null); };
  useLayer(open, shut);
  /* A press on another question is its fold's, which holds it in place: folded here first, the page jumped. */
  useClickAway(openLi, open, e => { if (!e.target.closest('.chapter-h')) shut(); });
  return html`<${Search} value=${find} set=${setFind} />
    <${Block}><ul class="list">${shown.map(s => html`<${Chapter} key=${s.id} s=${s} li=${open === s.id ? openLi : null} onFold=${fold(s)} onDelete=${() => deleteThing(s)} />`)}</ul><//>`;
}
/* A question answered: its row (a click folds or unfolds it; unfolded, its trash on its line), then what I
   asked, Claude's answer and where it comes from (only web links: the answer comes from outside SIByL). li: the open
   one's ref (see Answered). */
function Chapter({ s, li, onFold, onDelete }) {
  const links = s.sources.filter(x => /^https?:\/\//.test(x.url)), open = !!li;
  return html`<li ref=${li}>
    <div class="pick-row chapter-h" onClick=${opens(onFold)}>
      <div class="li-body"><button class=${cx('li-title', !s.read && 'unread')} aria-expanded=${open} onClick=${onFold}>${s.title}</button></div>
      ${open && html`<${Trash} cls="pick-del" label=${'Delete ' + s.title} onClick=${onDelete} />`}
      <span class="chev"><${Icon} name="right" size=${14} /></span>
    </div>
    ${open && html`<div class="chapter">${s.note && html`<div class="note">${linked(s.note)}</div>`}<${Prose} text=${s.answer} />
      ${links.length > 0 && html`<div class="sources">${links.map(x => html`<a href=${x.url} target="_blank" rel="noopener noreferrer"><${Icon} name="link" size=${13} />${x.title}</a>`)}</div>`}</div>`}
  </li>`;
}
/* Claude's answer, written in Markdown's plain parts: headings, paragraphs, - and 1. lists, **bold**, *italic*; a
   [link](…) keeps only its words (the sources hold the links). Drawn as text, so nothing in it becomes markup. */
const inline = t => t.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/)
  .map((p, i) => i % 2 ? (p.startsWith('**') ? html`<b>${p.slice(2, -2)}</b>` : html`<i>${p.slice(1, -1)}</i>`) : p);
function Prose({ text }) {
  const blocks = [];
  let gap = true;
  for (const line of text.split('\n')) {
    const t = line.trim(), last = blocks.at(-1), head = t.match(/^#+\s+(.*)/), item = t.match(/^(?:[-*•]|(\d+)[.)])\s+(.*)/);
    if (!t) { gap = true; continue; }
    if (head) blocks.push({ tag: 'h3', text: head[1] });
    else if (item) { const tag = item[1] ? 'ol' : 'ul'; if (last?.tag === tag) last.items.push(item[2]); else blocks.push({ tag, start: item[1], items: [item[2]] }); }
    else if (last?.tag === 'p' && !gap) last.text += ' ' + t;
    else blocks.push({ tag: 'p', text: t });
    gap = false;
  }
  return html`<div class="prose">${blocks.map(b => b.items
    ? html`<${b.tag} start=${b.start}>${b.items.map(x => html`<li>${inline(x)}</li>`)}<//>`
    : html`<${b.tag}>${inline(b.text)}<//>`)}</div>`;
}

/* ==== Calendar ==== */
/* What's done once, from tomorrow on (today is Next's; what repeats is Ticklers'). Its days as OmniFocus's Forecast
   has them: Tomorrow, five days more, then Future, each with its count (seven tiles: with eight, "Tomorrow" didn't
   fit on a phone); a tap shows that day alone, an empty one can't be picked. A pane a day, titled by its date
   ("Tomorrow — Fri 6 Nov"), so its rows don't repeat it; Future's rows name theirs. A task dragged into another
   day's pane, or onto a day's tile, moves to that day (startDrag). */
function CalendarView() {
  const [pick, setPick] = useKept('day', null);
  const t = todayISO(), next = [1, 2, 3, 4, 5, 6].map(n => addDays(t, n));
  const list = all('task').filter(r => r.date > t && !isRepeating(r) && !onHold(r)).sort(byDay);
  const days = [
    ...next.map((d, i) => ({ id: d, label: i ? `${WD[parseDay(d).getDay()]} ${parseDay(d).getDate()}` : 'Tomorrow', title: paneDay(d), list: list.filter(r => r.date === d) })),
    { id: '', label: 'Future', title: 'Future', list: list.filter(r => r.date > next.at(-1)) },
  ];
  const day = days.find(d => d.id === pick && d.list.length);
  const tasks = taskRows(r => r.date > next.at(-1) && fmtWeekday(r.date));
  const adding = newOpen('task');
  return html`<div class="page" data-zone>
    <${PageHeader} nav="calendar"><${AddButton} label="New task" onClick=${() => openThing({ kind: 'task' })} /><//>
    ${list.length ? html`<div class="dates" role="group" aria-label="Days">${days.map(d => html`<button key=${d.id} class=${cx(day === d && 'on')} data-into=${d.id || undefined}
      aria-pressed=${day === d} disabled=${!d.list.length} onClick=${() => setPick(day === d ? null : d.id)}>${d.label}<b>${d.list.length}</b></button>`)}</div>` : !adding && html`<p class="empty">Nothing ahead.</p>`}
    ${adding && html`<${NewThing} />`}
    ${(day ? [day] : days.filter(d => d.list.length)).map(d => html`<${Block} key=${d.id} title=${d.title} data-lane=${d.id}>${tasks(d.list)}<//>`)}
  </div>`;
}

/* ==== The Sweep ==== */
/* What an Inbox item can become when it can't be done now: what each makes (kind) opens in the item's place, as a
   page's + opens one, and the Sweep's Save files it. start(words): what the new one starts with (the Calendar's and
   a Tickler's from tomorrow on, later: what's for today is a next action); a new project's, its next action (the
   item is mostly that, the project's name still to write). Project asks Which one? first: a new one (fresh) or one
   there is (into), the item then the last of its infos. */
const ANSWERS = [
  { id: 'next', label: 'Next', icon: 'clockDisc', color: 'var(--c-next)', kind: 'task', start: t => ({ title: t, date: '', next: true }) },
  { id: 'calendar', label: 'Calendar', icon: 'forecast', color: 'var(--c-calendar)', kind: 'task', start: t => ({ title: t, later: true }) },
  { id: 'tickler', label: 'Tickler', icon: 'repeat', color: 'var(--c-ticklers)', kind: 'task', start: t => ({ title: t, ...TICKLER, later: true }) },
  { id: 'project', label: 'Project', icon: 'project', color: 'var(--c-projects)', kind: 'project', start: t => ({ action: t }), into: () => inOrder('project'), fresh: 'New project…' },
  { id: 'someday', label: 'Someday', icon: 'someday', color: 'var(--c-someday)', kind: 'task', start: t => ({ title: t, date: '' }) },
  { id: 'delegate', label: 'Delegate', icon: 'stack', color: 'var(--c-research)', kind: 'question', start: t => ({ title: t }) },
];

/* OK, or Decide what it becomes. Its step (now; file: the choices; which: Which one?) is kept (useKept), so SIByL
   reopened mid-Sweep comes back to it. Space is OK (done, or not worth doing: either way it goes, so no trash),
   still there once Decided; Esc is Decide, Backspace the Back (data-kbd), a step at a time. Each step's bar is its
   own, so a pressed button doesn't become the next step's (Decide into Back, still lit). Which one? and what the
   item is filed as come in the choices' place under the choice picked (.chosen); what it's filed as alone, as it
   starts from the item's words (bar: Back drops it, Save files it). Filed, Undo brings it back to the choices. */
function SweepItem({ it, left }) {
  const [step, setStep] = useKept(it.id + ':step', 'now');
  /* The choice picked last: Which one? asks for it, and back at the choices the › is on it again. */
  const [chose, setChose] = useKept(it.id + ':chose', null);
  const done = () => removeWithUndo(it, `Done: ${clip(it.text)}`, DONE_MANY, 'inbox-done');
  const file = a => o => fileItem(it, a.kind, o);
  const make = a => openThing({ kind: a.kind, ...a.start(it.text), answer: a, file: file(a) });
  const pick = a => { setChose(a.id); if (a.into) setStep('which'); else make(a); };
  const now = step === 'now', which = step === 'which' && ANSWERS.find(a => a.id === chose), o = !now && ui.open;
  useLayer(which, () => setStep('file'));
  const at = o ? 'edit' : step;
  const back = (kbd, onClick) => html`<button class="btn ghost" data-kbd=${kbd} onClick=${onClick}><${Icon} name="left" size=${16} />Back</button>`;
  const ok = html`<button class="btn primary" data-kbd="space" onClick=${done}><${Icon} name="check" size=${16} />OK</button>`;
  const bar = now
    ? html`<span class="spacer"></span><button class="btn" data-kbd="esc" onClick=${() => setStep('file')}>Decide</button>${ok}`
    : o ? html`${back(null, () => opened.drop())}<span class="spacer"></span><button class="btn primary" onClick=${() => opened.save()}>Save</button>`
    : html`${back('back', () => setStep(which ? 'file' : 'now'))}<span class="spacer"></span>${ok}`;
  return html`<div class="sweep-body">
      ${o ? html`<div class="sweep-step" key=${at}>
          <div class="eyebrow chosen">${face(o.answer)}</div>
          <${NewThing} bar />
        </div>` : html`
        <div class="eyebrow">Inbox · ${left === 1 ? 'the last one' : left + ' left'}</div>
        <h2 class="sweep-title"><${EditableText} value=${it.text} onSave=${text => patchItem(it.id, { text })} /></h2>
        ${which ? html`<div class="sweep-step" key=${at}>
            <div class="eyebrow chosen">${face(which)}</div>
            <${PickList} search options=${[{ id: NEW, label: which.fresh }, ...which.into().map(x => ({ id: x.id, label: x.title }))]}
              onPick=${x => x.id === NEW ? make(which) : file(which)({ id: x.id })} />
          </div>`
        : !now && html`<div class="sweep-step" key=${at}><${PickList} options=${ANSWERS} start=${chose} onPick=${pick} /></div>`}`}
    </div>
    <div class="bar" key=${at}>${bar}</div>`;
}

/* The Inbox one thing at a time, oldest first (begun by sweep, on an Inbox with something in it). Once the last one is
   gone through it's over: back on Next, the toast of what became of it (its Undo) left showing. Left by Stop (Shift +
   S), Back or the rail too; a closed tab reopens in it (useKept). */
function SweepView() {
  const items = all('inbox').sort(byCreated);
  const leave = () => navigate('next');
  useLayoutEffect(() => { if (!items.length) leave(); }, [items.length]);
  return html`<div class="page">
    <button class="icon-btn sweep-stop" aria-label="Stop" data-kbd="stop" onClick=${leave}><${Icon} name="stop" size=${16} /></button>
    ${items.length > 0 && html`<${SweepItem} key=${items[0].id} it=${items[0]} left=${items.length} />`}
  </div>`;
}

/* ==== Capture, the one window ==== */
/* Capture (C, a phone's round button): what's typed goes to the Inbox, a line an item. A window over the page
   (ui.window), a tool rather than a page: × in its header, its buttons in its foot. It takes the keyboard (its box, a
   phone's keyboard rising too: typing is the point there) and hands it back to its opener as it closes; Esc, a phone's
   Back or a press on the dim page around it closes it, Enter adds (see the keys). Closed with words in it, they're
   notSaved. */
const capture = () => setUI({ window: true });
function Capture() {
  const [v, setV] = useState('');
  const box = useRef(null), body = useRef(null);
  const add = () => {
    const n = addToInbox(v);
    if (!n) return;
    setUI({ window: false });
    toast(n === 1 ? 'Added to Inbox' : `${n} items added to Inbox`);
  };
  const close = () => { setUI({ window: false }); if (v.trim()) notSaved(add); };
  useLayer(true, close, add);
  useInSight(box, body);
  useEffect(() => {
    const from = document.activeElement;
    takeKeyboard(box.current);
    return () => { if (from.isConnected) from.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="scrim" onMouseDown=${e => { if (e.target === e.currentTarget) close(); }}>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Capture" tabindex="-1" ref=${box}>
      <header class="modal-h"><h2>Capture</h2><button class="icon-btn" aria-label="Close" data-tip="Close" onClick=${close}><${Icon} name="x" /></button></header>
      <div class="modal-b" ref=${body}>
        <${AutoTextarea} class="field" rows="4" value=${v} autofocus placeholder="What’s on your mind?" aria-label="Capture to Inbox" onInput=${e => setV(e.target.value)} />
      </div>
      <footer class="modal-f"><span class="spacer"></span><button class="btn ghost" onClick=${close}>Cancel</button><button class="btn primary" onClick=${add} disabled=${!v.trim()}>Add to Inbox</button></footer>
    </div>
  </div>`;
}

/* ==== History and Settings, at the rail's foot ==== */
/* The tasks ticked in the last days (see logDone), a pane a day as the Calendar's, the latest first: what my days
   went on. */
function HistoryView() {
  const t = todayISO();
  const done = all('done').filter(d => dayDiff(d.day, t) < HISTORY_DAYS).sort((a, b) => byCreated(b, a));
  return html`<div class="page">
    <${PageHeader} nav="tools" icon="history" title="History" />
    ${done.length ? [...new Set(done.map(d => d.day))].map(d => html`<${Block} key=${d} title=${paneDay(d)}><ul class="list">
      ${done.filter(x => x.day === d).map(x => html`<li key=${x.id} class="li"><span class="li-title">${x.title}</span></li>`)}
    </ul><//>`) : html`<p class="empty">Nothing done in the last ${HISTORY_DAYS} days.</p>`}
  </div>`;
}
/* Settings take effect as they're changed, as a Mac's do. Contexts are docs of their own, as tasks name them:
   renamed, dragged into Next's order, added at their foot; one still holding tasks has no trash, as they'd have
   nowhere to show. Restore writes a backup's entries as they are (same id replaced, nothing deleted), with Undo. */
const HOURS = Array.from({ length: 13 }, (_, h) => ({ id: h, label: new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) }));
const REVIEW_DAYS = [6, 0].map(d => ({ id: d, label: WD_LONG[d] }));
function SettingsView() {
  const file = useRef(null), contexts = inOrder('context'), tap = useTapped();
  /* Saved as the browser saves any download. */
  const download = () => {
    const data = JSON.stringify({ app: 'sybil', items: Object.values(store.items) }, null, 1);
    Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([data])), download: `sybil-backup-${todayISO()}.json` }).click();
  };
  const restore = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    let d;
    try { d = JSON.parse(await f.text()); } catch {}
    if (d?.app !== 'sybil' || !Array.isArray(d.items)) return toast('That file isn’t a SIByL backup.', { bad: true });
    toast(`Restored ${d.items.length} entries`, { undo: undoable(() => d.items.forEach(put)) });
  };
  return html`<div class="page">
    <${PageHeader} nav="tools" icon="settings" title="Settings" />
    <${Block} title="Inbox tickler"><${AutoTextarea} class="field" rows="3" aria-label="Inbox tickler" value=${setting('tickler')} onInput=${e => setSetting('tickler', e.target.value)} /><//>
    <${Block} title="Day"><div class="row"><span>Starts at</span><${Select} aria-label="Day starts at" options=${HOURS} value=${setting('dayStart')} onChange=${v => setSetting('dayStart', +v)} /></div><//>
    <${Block} title="Weekly review"><div class="row"><${Select} aria-label="On" options=${REVIEW_DAYS} value=${setting('reviewDay')} onChange=${v => setSetting('reviewDay', +v)} /></div><//>
    <${Block} title="Contexts"><ul class="lines" data-zone>
      ${contexts.map(c => html`<${ListLine} key=${c.id} ...${tap(c.id)} text=${c.title} onSave=${title => patchItem(c.id, { title })} at=${c.id}
        onDelete=${!all('task').some(r => r.context === c.id) && (() => deleteThing(c))} onMove=${before => placeInList(contexts, c, before)} />`)}
      <${AddLine} hint="New context" onAdd=${lines => lines.forEach(title => makeThing('context', { title }))} />
    </ul><//>
    <${Block} title="Sync"><div class="row"><button class="btn" onClick=${auth ? disconnect : connect}>${auth ? 'Disconnect' : 'Connect'} Dropbox</button></div><//>
    <${Block} title="Backup"><div class="row"><button class="btn" onClick=${download}>Download backup</button><button class="btn" onClick=${() => file.current.click()}>Restore from…</button></div>
      <input ref=${file} type="file" accept="application/json,.json" hidden onChange=${restore} /><//>
  </div>`;
}

/* ==== The app ==== */
/* Ticklers: what repeats, by when it next comes up, a new one weekly. Someday: what I might do one day, with no day
   set, an Inbox of its own (Picks' rows with a trash), in the order dragged, only ever made a project (see
   TaskEditor). Projects: those going on, then those on hold (committed to, so not Someday's: the user's ask). */
const VIEWS = { next: NextView, inbox: InboxView, sweep: SweepView, calendar: CalendarView, history: HistoryView, settings: SettingsView,
  ticklers: () => {
    const list = all('task').filter(isRepeating).sort(byDay), tasks = taskRows(r => fmtDay(r.date)), adding = newOpen('task');
    return html`<div class="page">
      <${PageHeader} nav="ticklers"><${AddButton} label="New tickler" onClick=${() => openThing({ kind: 'task', ...TICKLER })} /><//>
      ${adding && html`<${NewThing} />`}
      ${list.length ? html`<${Block} data-zone>${tasks(list)}<//>` : !adding && html`<p class="empty">Nothing repeats.</p>`}
    </div>`;
  },
  someday: () => html`<div class="page">
    <${PageHeader} nav="someday"><${AddButton} label="New task" onClick=${() => openThing({ kind: 'task', date: '' })} /><//>
    ${newOpen('task') && html`<${NewThing} />`}
    <${Picks} kind="task" list=${all('task').filter(r => kindOf(r) === 'someday').sort(byOrder)} trash empty="Nothing for someday." />
  </div>`,
  projects: () => { const list = inOrder('project'), hold = list.filter(isHeld); return html`<div class="page">
    <${PageHeader} nav="projects"><${AddButton} label="New project" onClick=${() => openThing({ kind: 'project' })} /><//>
    ${newOpen('project') && html`<${NewThing} />`}
    <${Picks} kind="project" list=${list.filter(p => !isHeld(p))} empty=${!hold.length} />
    <${Picks} kind="project" list=${hold} title="On hold" />
  </div>`; }, research: ResearchView };
function App() {
  useLayoutEffect(() => { main().scrollTop = scrollTo; }, [route]);
  const View = VIEWS[route.view];
  const t = shownToast;
  return html`<div class="app">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false" dangerouslySetInnerHTML=${{ __html: ART_DEFS }}></svg>
    <${Sidebar} />
    <header class="topbar"><${Tools} /></header>
    <main class="main" key=${route.view}>
      <${View} />
    </main>
    ${route.view !== 'inbox' && html`<button class="fab" aria-label="Capture to Inbox" data-tip="Capture to Inbox" onClick=${capture}><${Icon} name="capture" size=${26} /></button>`}
    ${ui.window && html`<${Capture} />`}
    ${ui.splash && html`<${Splash} key=${ui.splash.words} ...${ui.splash} />`}
    <div class="toasts" aria-live="polite">${t && html`<div class="toast" key=${t.id}>
      <span class=${cx(t.bad && 'bad')}>${t.msg}</span>
      ${t.undo && html`<button onClick=${() => { t.undo(); dismissToast(t.id); }}>Undo</button>`}
      <button aria-label="Dismiss" data-tip="Dismiss" onClick=${() => dismissToast(t.id)}><${Icon} name="x" size=${14} /></button>
    </div>`}</div>
  </div>`;
}

/* Every key SIByL answers, once the box typed in (typing) and a list's cursor (PickList) have had theirs. Esc closes
   the newest thing open (useLayer), else lets go of the box, as a browser's address bar does. Enter is the Done of
   what's open wherever the keyboard is in it, as a Mac dialog's Return (Enter on a weekday toggled it instead of
   saving), but not on a link, words to rename or a file input, nor with Shift in a box taking several lines; Ctrl or
   ⌘ + Enter anywhere; a moment later, once a box has kept its words (an info). The rest are the page's, not while
   typing nor under the window: a button a key presses carries data-kbd (the Sweep's OK, Decide and Stop, a page's +
   as Shift + N; Space on a button Tab is on presses that one), else C captures, Shift + S starts the Sweep, a digit
   goes to its section and Backspace goes back (goBack). With a thing open only C and Shift + N work, as their
   buttons do (Capture floats over it, the + saves it first): the rest would leave it unsaved. Esc and Backspace are
   always SIByL's, so the browser never acts on them (Backspace has been its Back, and has scrolled the page). */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target, typed = t.matches('input, textarea, select'), top = layers.at(-1)?.current, mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape' && top) { e.preventDefault(); return top.close(e); }
  if (e.key === 'Enter' && top?.done) {
    if (e.repeat || (!mod && (t.matches('a, [role=button], input[type=file]') || (e.shiftKey && t.matches('textarea:not([enterkeyhint=done])'))))) return;
    e.preventDefault();
    return setTimeout(() => layers.at(-1)?.current.done?.());
  }
  if (e.key === 'Escape' && typed) { e.preventDefault(); return t.blur(); }
  if (mod || e.altKey || typed || (e.key === ' ' && t.matches('button'))) return;
  if (e.key === 'Escape' || e.key === 'Backspace') e.preventDefault();
  if (ui.window) return;
  const kbd = { ' ': 'space', Escape: 'esc', S: 'stop', N: 'new' }[e.key], press = kbd && document.querySelector(`[data-kbd="${kbd}"]`);
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); capture(); }
  else if (opened && kbd !== 'new') return;
  else if (press) { e.preventDefault(); if (!e.repeat) press.click(); }
  else if (e.key === 'S') { e.preventDefault(); sweep(); }
  else if (/^[1-9]$/.test(e.key) && NAV[e.key - 1]) { e.preventDefault(); navigate(NAV[e.key - 1].id); }
  else if (e.key === 'Backspace' && !e.shiftKey && !e.repeat) goBack();
});
/* A phone's Back puts its keyboard away but leaves the box focused, and the tabs stepped aside for nothing (see .app):
   as the frame grows back by a keyboard's height (more than a browser bar's), the box is let go, as Esc lets go. */
let tall = innerHeight;
addEventListener('resize', () => {
  if (touching() && innerHeight - tall > 150) document.activeElement.blur();
  tall = innerHeight;
});
/* A redraw a minute while in view, and one on return, keep today and what's due current, and it syncs again (see
   watch). Going out of sight, what's not pushed yet goes, and the Sweep under way is put by (see route). */
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { refresh(); return watch(); }
  unwatch();
  if (store.unpushed) syncNow();
  localStorage.setItem('sybil.sweep', JSON.stringify(route.view === 'sweep' ? route.kept : null));
});
addEventListener('online', () => { unwatch(); watch(); refresh(); });
addEventListener('offline', refresh);
/* Leaving with changes Dropbox hasn't had yet asks first, in the browser's own words, as Google Keep does (the user's
   ask). */
addEventListener('beforeunload', e => { if (auth && store.unpushed) e.preventDefault(); });

/* Inter comes in parts by script (Google's subsets), each fetched the first time a page shows one of its letters, and
   that page then drew its words late (Ticklers' and Research's ă, ș, ț): every part the lists need is fetched
   at the start. The copy is asked to stay when the browser runs short of room. */
document.fonts.load('1em Inter', JSON.stringify(store.items));
navigator.storage.persist();
/* What the address brings, read once as SIByL starts and cleared (before hold adds its history entry): Dropbox's
   sign-in coming back. */
const code = new URLSearchParams(location.search).get('code');
if (location.search) history.replaceState(null, '', home);
if (code) signedIn(code);
/* Offline (see sw.js); none over plain http. */
navigator.serviceWorker?.register('sw.js');
refresh();
watch();
});
</script>
